# =============================================================================
# scrCompleted — both stages submitted (also the return view once done).
# Green "submission complete" banner + "Submitted on <date>"; locked ranking in
# order; locked Stage-2 answers grouped by role + question. NO edit controls.
#   galRanking      Items = colLockedRanking          (REPOINT -> Preferences)
#   galAnswerGroups inner Items = Filter(colAnswers...) (REPOINT -> PreferenceResponses)
#   Blank answers fall back to colSampleAnswers (preview only).
# =============================================================================
Screens:
  scrCompleted:
    Properties:
      Fill: =ColorValue("#F2F5F7")
    Children:
      - conRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =ColorValue("#F2F5F7")
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
          Children:
            - conHeaderBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Fill: =ColorValue("#002B54")
                  Height: =64
                  Width: =Parent.Width
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - lblHdrName:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        Text: ="Aurora — Role Preference"
                        Color: =ColorValue("#FFFFFF")
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                  - lblHdrUser:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        Text: =varUser.Name & "  ·  " & varUser.Grade
                        Color: =ColorValue("#A9BACB")
                        Size: =12
                        Align: =Align.Right
            - recGreenStrip:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Fill: =ColorValue("#008531")
                  Height: =4
                  Width: =Parent.Width
            - conMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  Width: =Parent.Width
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  PaddingTop: =24
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - conContent:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        Width: =Min(Parent.Width - 48, 1120)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =18
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                      Children:
                        - btnBackHome:
                            Control: Label@2.5.1
                            Properties:
                              HoverFill: =ColorValue("#E1F2FB")
                              PressedFill: =ColorValue("#C7E6F4")
                              FillPortions: =0
                              Text: ="← Back to home"
                              OnSelect: =Navigate(scrLanding)
                              Fill: =ColorValue("#F2F5F7")
                              Color: =ColorValue("#0E6FA8")
                              BorderThickness: =0
                              Align: =Align.Left
                              Size: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              Width: =160
                        # ---- Green success banner ----
                        - cardSuccess:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =140
                              FillPortions: =0
                              Fill: =ColorValue("#008531")
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              PaddingTop: =22
                              PaddingBottom: =22
                              PaddingLeft: =28
                              PaddingRight: =28
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              Width: =Parent.Width
                            Children:
                              - lblSuccEyebrow:
                                  Control: Label@2.5.1
                                  Properties:
                                    Width: =Parent.Width
                                    FillPortions: =0
                                    Text: ="SUBMISSION COMPLETE"
                                    Color: =ColorValue("#FFFFFF")
                                    Size: =13
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                              - lblSuccTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="Your ranking and answers have been submitted"
                                    Color: =ColorValue("#FFFFFF")
                                    Size: =24
                                    FontWeight: =FontWeight.Bold
                                    AutoHeight: =true
                                    Width: =Parent.Width - 68
                              - lblSuccDate:
                                  Control: Label@2.5.1
                                  Properties:
                                    Width: =Parent.Width
                                    FillPortions: =0
                                    Text: ="Submitted on " & varStage2Date
                                    Color: =ColorValue("#FFFFFF")
                                    Size: =16
                                    Height: =24
                        # ---- Locked ranking ----
                        - cardRanking:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              # header (72) + one 60px row per ranked role, plus slack so
                              # galRanking never needs its own scrollbar
                              Height: =72 + CountRows(colLockedRanking) * 60 + 24
                              FillPortions: =0
                              Fill: =ColorValue("#FFFFFF")
                              BorderColor: =ColorValue("#DCE2E8")
                              BorderThickness: =1
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              LayoutDirection: =LayoutDirection.Vertical
                              Width: =Parent.Width
                            Children:
                              - conRankHdr:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =72
                                    FillPortions: =0
                                    BorderColor: =ColorValue("#DCE2E8")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    PaddingTop: =16
                                    PaddingBottom: =16
                                    PaddingLeft: =24
                                    PaddingRight: =24
                                    Width: =Parent.Width
                                  Children:
                                    - lblRankHdr:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =1
                                          Text: ="Your ranked preferences"
                                          Color: =ColorValue("#002B54")
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                    - lblLockedPill:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="Locked"
                                          Color: =ColorValue("#5B6670")
                                          Fill: =ColorValue("#EEF2F5")
                                          BorderColor: =ColorValue("#DCE2E8")
                                          BorderThickness: =1
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =80
                                          Height: =26
                              - galRanking:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    FillPortions: =0
                                    Items: =colLockedRanking
                                    Width: =Parent.Width
                                    Height: =CountRows(colLockedRanking) * 60 + 16
                                    TemplateSize: =60
                                    TemplatePadding: =0
                                  Children:
                                    - conRankRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutGap: =18
                                          PaddingTop: =16
                                          PaddingBottom: =16
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          BorderColor: =ColorValue("#EEF1F4")
                                          BorderThickness: =1
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight
                                        Children:
                                          - lblRankCircle:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =ThisItem.Rank
                                                Fill: =ColorValue("#002B54")
                                                Color: =ColorValue("#FFFFFF")
                                                Size: =15
                                                FontWeight: =FontWeight.Bold
                                                Align: =Align.Center
                                                VerticalAlign: =VerticalAlign.Middle
                                                Width: =34
                                                Height: =34
                                          - conRankText:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                Width: =Parent.Width - 80
                                              Children:
                                                - lblRankName:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Width: =Parent.Width
                                                      FillPortions: =0
                                                      Text: =ThisItem.RoleName
                                                      Color: =ColorValue("#1F2933")
                                                      Size: =16
                                                      FontWeight: =FontWeight.Bold
                                                      Height: =24
                        # ---- Locked supporting answers ----
                        - cardAnswers:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              # Header + however tall the three sections turn out
                              FillPortions: =0
                              Height: |-
                                =72 + cmpSec1.Height
                                    + If(CountRows(colLockedRanking) >= 2, cmpSec2.Height, 0)
                                    + If(CountRows(colLockedRanking) >= 3, cmpSec3.Height, 0)
                              Fill: =ColorValue("#FFFFFF")
                              BorderColor: =ColorValue("#DCE2E8")
                              BorderThickness: =1
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              LayoutDirection: =LayoutDirection.Vertical
                              Width: =Parent.Width
                            Children:
                              - conAnsHdr:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =72
                                    FillPortions: =0
                                    BorderColor: =ColorValue("#DCE2E8")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    PaddingTop: =16
                                    PaddingBottom: =16
                                    PaddingLeft: =24
                                    PaddingRight: =24
                                    Width: =Parent.Width
                                  Children:
                                    - lblAnsHdr:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =1
                                          Text: ="Your supporting answers"
                                          Color: =ColorValue("#002B54")
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                    - lblAnsLockedPill:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="Locked"
                                          Color: =ColorValue("#5B6670")
                                          Fill: =ColorValue("#EEF2F5")
                                          BorderColor: =ColorValue("#DCE2E8")
                                          BorderThickness: =1
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =80
                                          Height: =26
                              # Explicit sections, not nested galleries: a
                              # gallery TemplateSize is fixed, so a 150-word
                              # answer overflowed its row (clipped text) and the
                              # gallery grew its own scrollbar. Heights below are
                              # sums of the AutoHeight children, so answers of any
                              # length are shown in full and the page is the only
                              # scrolling surface.
                              - cmpSec1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Visible: =CountRows(colLockedRanking) >= 1
                                    FillPortions: =0
                                    Height: =cmpHdr1.Height + cmpBlk1a.Height + cmpBlk1b.Height
                                    BorderColor: =ColorValue("#EEF1F4")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: =Parent.Width
                                  Children:
                                    - cmpHdr1:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =cmpRole1.Height + 44
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          PaddingTop: =20
                                          PaddingBottom: =4
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.Width
                                        Children:
                                          - cmpRank1:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: ="TOP CHOICE · RANK 1"
                                                Color: =ColorValue("#0E6FA8")
                                                Size: =12
                                                FontWeight: =FontWeight.Bold
                                                Height: =18
                                                Width: =Parent.Width - 48
                                          - cmpRole1:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =Index(colLockedRanking, 1).RoleName
                                                Color: =ColorValue("#002B54")
                                                Size: =17
                                                FontWeight: =FontWeight.Bold
                                                Width: =Parent.Width - 48
                                    - cmpBlk1a:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =cmpQ1a.Height + cmpA1a.Height + 24
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.Width
                                        Children:
                                          - cmpQ1a:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =LookUp(colAnswers, RoleKey = Index(colLockedRanking, 1).RoleKey And QIndex = 0).QuestionText
                                                Color: =ColorValue("#475160")
                                                Size: =14
                                                FontWeight: =FontWeight.Semibold
                                                Width: =Parent.Width - 48
                                          - cmpA1a:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =With(
                                                      {a: LookUp(colAnswers, RoleKey = Index(colLockedRanking, 1).RoleKey And QIndex = 0).Answer},
                                                      If(Len(Trim(a)) > 0, a, "—")
                                                  )
                                                Color: =ColorValue("#1F2933")
                                                Fill: =ColorValue("#F4F7F9")
                                                BorderColor: =ColorValue("#E1E7EC")
                                                BorderThickness: =1
                                                Size: =15
                                                PaddingTop: =12
                                                PaddingBottom: =12
                                                PaddingLeft: =14
                                                PaddingRight: =14
                                                Width: =Parent.Width - 48
                                    - cmpBlk1b:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =cmpQ1b.Height + cmpA1b.Height + 24
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.Width
                                        Children:
                                          - cmpQ1b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =LookUp(colAnswers, RoleKey = Index(colLockedRanking, 1).RoleKey And QIndex = 1).QuestionText
                                                Color: =ColorValue("#475160")
                                                Size: =14
                                                FontWeight: =FontWeight.Semibold
                                                Width: =Parent.Width - 48
                                          - cmpA1b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =With(
                                                      {a: LookUp(colAnswers, RoleKey = Index(colLockedRanking, 1).RoleKey And QIndex = 1).Answer},
                                                      If(Len(Trim(a)) > 0, a, "—")
                                                  )
                                                Color: =ColorValue("#1F2933")
                                                Fill: =ColorValue("#F4F7F9")
                                                BorderColor: =ColorValue("#E1E7EC")
                                                BorderThickness: =1
                                                Size: =15
                                                PaddingTop: =12
                                                PaddingBottom: =12
                                                PaddingLeft: =14
                                                PaddingRight: =14
                                                Width: =Parent.Width - 48
                              - cmpSec2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Visible: =CountRows(colLockedRanking) >= 2
                                    FillPortions: =0
                                    Height: =cmpHdr2.Height + cmpBlk2a.Height + cmpBlk2b.Height
                                    BorderColor: =ColorValue("#EEF1F4")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: =Parent.Width
                                  Children:
                                    - cmpHdr2:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =cmpRole2.Height + 44
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          PaddingTop: =20
                                          PaddingBottom: =4
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.Width
                                        Children:
                                          - cmpRank2:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: ="SECOND CHOICE · RANK 2"
                                                Color: =ColorValue("#0E6FA8")
                                                Size: =12
                                                FontWeight: =FontWeight.Bold
                                                Height: =18
                                                Width: =Parent.Width - 48
                                          - cmpRole2:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =Index(colLockedRanking, 2).RoleName
                                                Color: =ColorValue("#002B54")
                                                Size: =17
                                                FontWeight: =FontWeight.Bold
                                                Width: =Parent.Width - 48
                                    - cmpBlk2a:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =cmpQ2a.Height + cmpA2a.Height + 24
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.Width
                                        Children:
                                          - cmpQ2a:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =LookUp(colAnswers, RoleKey = Index(colLockedRanking, 2).RoleKey And QIndex = 0).QuestionText
                                                Color: =ColorValue("#475160")
                                                Size: =14
                                                FontWeight: =FontWeight.Semibold
                                                Width: =Parent.Width - 48
                                          - cmpA2a:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =With(
                                                      {a: LookUp(colAnswers, RoleKey = Index(colLockedRanking, 2).RoleKey And QIndex = 0).Answer},
                                                      If(Len(Trim(a)) > 0, a, "—")
                                                  )
                                                Color: =ColorValue("#1F2933")
                                                Fill: =ColorValue("#F4F7F9")
                                                BorderColor: =ColorValue("#E1E7EC")
                                                BorderThickness: =1
                                                Size: =15
                                                PaddingTop: =12
                                                PaddingBottom: =12
                                                PaddingLeft: =14
                                                PaddingRight: =14
                                                Width: =Parent.Width - 48
                                    - cmpBlk2b:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =cmpQ2b.Height + cmpA2b.Height + 24
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.Width
                                        Children:
                                          - cmpQ2b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =LookUp(colAnswers, RoleKey = Index(colLockedRanking, 2).RoleKey And QIndex = 1).QuestionText
                                                Color: =ColorValue("#475160")
                                                Size: =14
                                                FontWeight: =FontWeight.Semibold
                                                Width: =Parent.Width - 48
                                          - cmpA2b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =With(
                                                      {a: LookUp(colAnswers, RoleKey = Index(colLockedRanking, 2).RoleKey And QIndex = 1).Answer},
                                                      If(Len(Trim(a)) > 0, a, "—")
                                                  )
                                                Color: =ColorValue("#1F2933")
                                                Fill: =ColorValue("#F4F7F9")
                                                BorderColor: =ColorValue("#E1E7EC")
                                                BorderThickness: =1
                                                Size: =15
                                                PaddingTop: =12
                                                PaddingBottom: =12
                                                PaddingLeft: =14
                                                PaddingRight: =14
                                                Width: =Parent.Width - 48
                              - cmpSec3:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Visible: =CountRows(colLockedRanking) >= 3
                                    FillPortions: =0
                                    Height: =cmpHdr3.Height + cmpBlk3a.Height + cmpBlk3b.Height
                                    BorderColor: =ColorValue("#EEF1F4")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: =Parent.Width
                                  Children:
                                    - cmpHdr3:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =cmpRole3.Height + 44
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          PaddingTop: =20
                                          PaddingBottom: =4
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.Width
                                        Children:
                                          - cmpRank3:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: ="THIRD CHOICE · RANK 3"
                                                Color: =ColorValue("#0E6FA8")
                                                Size: =12
                                                FontWeight: =FontWeight.Bold
                                                Height: =18
                                                Width: =Parent.Width - 48
                                          - cmpRole3:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =Index(colLockedRanking, 3).RoleName
                                                Color: =ColorValue("#002B54")
                                                Size: =17
                                                FontWeight: =FontWeight.Bold
                                                Width: =Parent.Width - 48
                                    - cmpBlk3a:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =cmpQ3a.Height + cmpA3a.Height + 24
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.Width
                                        Children:
                                          - cmpQ3a:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =LookUp(colAnswers, RoleKey = Index(colLockedRanking, 3).RoleKey And QIndex = 0).QuestionText
                                                Color: =ColorValue("#475160")
                                                Size: =14
                                                FontWeight: =FontWeight.Semibold
                                                Width: =Parent.Width - 48
                                          - cmpA3a:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =With(
                                                      {a: LookUp(colAnswers, RoleKey = Index(colLockedRanking, 3).RoleKey And QIndex = 0).Answer},
                                                      If(Len(Trim(a)) > 0, a, "—")
                                                  )
                                                Color: =ColorValue("#1F2933")
                                                Fill: =ColorValue("#F4F7F9")
                                                BorderColor: =ColorValue("#E1E7EC")
                                                BorderThickness: =1
                                                Size: =15
                                                PaddingTop: =12
                                                PaddingBottom: =12
                                                PaddingLeft: =14
                                                PaddingRight: =14
                                                Width: =Parent.Width - 48
                                    - cmpBlk3b:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =cmpQ3b.Height + cmpA3b.Height + 24
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.Width
                                        Children:
                                          - cmpQ3b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =LookUp(colAnswers, RoleKey = Index(colLockedRanking, 3).RoleKey And QIndex = 1).QuestionText
                                                Color: =ColorValue("#475160")
                                                Size: =14
                                                FontWeight: =FontWeight.Semibold
                                                Width: =Parent.Width - 48
                                          - cmpA3b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =With(
                                                      {a: LookUp(colAnswers, RoleKey = Index(colLockedRanking, 3).RoleKey And QIndex = 1).Answer},
                                                      If(Len(Trim(a)) > 0, a, "—")
                                                  )
                                                Color: =ColorValue("#1F2933")
                                                Fill: =ColorValue("#F4F7F9")
                                                BorderColor: =ColorValue("#E1E7EC")
                                                BorderThickness: =1
                                                Size: =15
                                                PaddingTop: =12
                                                PaddingBottom: =12
                                                PaddingLeft: =14
                                                PaddingRight: =14
                                                Width: =Parent.Width - 48
                        # ---- Reassurance note ----
                        - cardNote:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =80
                              FillPortions: =0
                              Fill: =ColorValue("#F4F7F9")
                              BorderColor: =ColorValue("#E1E7EC")
                              BorderThickness: =1
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              PaddingTop: =20
                              PaddingBottom: =20
                              PaddingLeft: =22
                              PaddingRight: =22
                              Width: =Parent.Width
                            Children:
                              - lblNote:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="Thank you. Your ranking and answers have been recorded against your record and cannot be changed. If you believe anything here is incorrect, please contact dart@environment-agency.gov.uk"
                                    OnSelect: =Launch("mailto:dart@environment-agency.gov.uk")
                                    Color: =ColorValue("#3A4651")
                                    Size: =15
                                    AutoHeight: =true
                                    Width: =Parent.Width - 44
