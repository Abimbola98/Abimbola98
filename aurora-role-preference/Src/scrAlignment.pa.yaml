                                                      {a: LookUp(colAnswers, RoleKey = Index(colLockedRanking, 3).RoleKey And QIndex = 0).Answer},
                                                      If(Len(Trim(a)) > 0, a, "(no answer recorded)")
                                                  )
                                                Color: =ColorValue("#1F2933")
                                                Fill: =ColorValue("#FFFFFF")
                                                BorderColor: =ColorValue("#E4E9ED")
                                                BorderThickness: =1
                                                Size: =14
                                                PaddingTop: =10
                                                PaddingBottom: =10
                                                PaddingLeft: =13
                                                PaddingRight: =13
                                                Width: =Parent.Width - 48
                                          - aliQ3b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: ="SUPPORTING ANSWER 2 — SKILLS, EXPERIENCE AND QUALIFICATIONS"
                                                Color: =ColorValue("#0E6FA8")
                                                Size: =12
                                                FontWeight: =FontWeight.Bold
                                                PaddingTop: =6
                                                Width: =Parent.Width - 48
                                          - aliA3b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  =With(
                                                      {a: LookUp(colAnswers, RoleKey = Index(colLockedRanking, 3).RoleKey And QIndex = 1).Answer},
                                                      If(Len(Trim(a)) > 0, a, "(no answer recorded)")
                                                  )
                                                Color: =ColorValue("#1F2933")
                                                Fill: =ColorValue("#FFFFFF")
                                                BorderColor: =ColorValue("#E4E9ED")
                                                BorderThickness: =1
                                                Size: =14
                                                PaddingTop: =10
                                                PaddingBottom: =10
                                                PaddingLeft: =13
                                                PaddingRight: =13
                                                Width: =Parent.Width - 48
                        # ---- The aligned role + Kate/Claire's 150 words ----
                        - cardAliRole:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =72 + conAliRoleBody.Height
                              Fill: =ColorValue("#FFFFFF")
                              BorderColor: =ColorValue("#DCE2E8")
                              BorderThickness: =1
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              LayoutDirection: =LayoutDirection.Vertical
                              Width: =Parent.Width
                            Children:
                              - conAliRoleHdr:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =72
                                    FillPortions: =0
                                    Fill: =ColorValue("#002B54")
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    PaddingTop: =16
                                    PaddingBottom: =16
                                    PaddingLeft: =24
                                    PaddingRight: =24
                                    Width: =Parent.Width
                                  Children:
                                    - lblAliRoleHdr:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =1
                                          Text: ="Your aligned role"
                                          Color: =ColorValue("#FFFFFF")
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                    - lblAliRolePill:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="AWAITING YOUR RESPONSE"
                                          Color: =ColorValue("#8A4B00")
                                          Fill: =ColorValue("#FDF1E3")
                                          Size: =11
                                          FontWeight: =FontWeight.Bold
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =230
                                          Height: =26
                              - conAliRoleBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    # Role name only. The "why you have been aligned"
                                    # reasoning was removed from this page at the
                                    # 23.09.26 change request.
                                    Height: =lblAliRoleName.Height + 54
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =10
                                    PaddingTop: =22
                                    PaddingBottom: =24
                                    PaddingLeft: =24
                                    PaddingRight: =24
                                    Width: =Parent.Width
                                  Children:
                                    - lblAliRoleName:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          AutoHeight: =true
                                          Text: |-
                                            =Coalesce(varAlignRole, "(no role has been published for you yet)")
                                          Color: =ColorValue("#002B54")
                                          Size: =22
                                          FontWeight: =FontWeight.Bold
                                          Width: =Parent.Width - 48
                        # ---- Accept / Reject ------------------------------
                        - cardAliDecide:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              # padding 46 + title 28 + buttons 66 + three 10px gaps
                              # + slack, plus the two AutoHeight children.
                              Height: =lblAliDecideBody.Height + conAliConfirm.Height + 176
                              Fill: =ColorValue("#FFFFFF")
                              BorderColor: =ColorValue("#DCE2E8")
                              BorderThickness: =1
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingTop: =22
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - lblAliDecideTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="Do you accept this role?"
                                    Color: =ColorValue("#002B54")
                                    Size: =18
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    Width: =Parent.Width - 48
                              - lblAliDecideBody:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: |-
                                      ="You can either accept the proposed role and team allocation or raise a query where you believe the outcome does not appropriately reflect your circumstances. "
                                      & "Queries will be assessed against two criteria:"
                                      & Char(10) & "1.  Failure to follow our processes"
                                      & Char(10) & "2.  Discrimination"
                                    Color: =ColorValue("#5B6670")
                                    Size: =14
                                    Width: =Parent.Width - 48
                              # ---- Mandatory line-manager confirmation -----
                              # 23.09.26: Accept and Reject both refuse, with an
                              # error, until this is ticked. It is a Label tick
                              # box for the same reason the rejection reasons
                              # are - there is no Checkbox in the pinned set.
                              # locConfirmMissed turns the box red after a
                              # refused attempt, so the error has somewhere to
                              # point; ticking clears it.
                              - conAliConfirm:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =Max(aliConfirmText.Height, 28) + 24
                                    Fill: =If(locConfirmMissed, ColorValue("#FBEAEA"), ColorValue("#F4F7F9"))
                                    BorderColor: =If(locConfirmMissed, ColorValue("#C42B2B"), ColorValue("#E1E7EC"))
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    LayoutGap: =12
                                    PaddingTop: =12
                                    PaddingBottom: =12
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    Width: =Parent.Width - 48
                                  Children:
                                    - aliConfirmBox:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: =If(locLmConfirmed, "✓", "")
                                          OnSelect: |-
                                            =UpdateContext({locLmConfirmed: Not locLmConfirmed, locConfirmMissed: false})
                                          Fill: =If(locLmConfirmed, ColorValue("#008531"), ColorValue("#FFFFFF"))
                                          HoverFill: =If(locLmConfirmed, ColorValue("#00712A"), ColorValue("#E4F3EA"))
                                          PressedFill: =ColorValue("#B5DEC5")
                                          Color: =ColorValue("#FFFFFF")
                                          BorderColor: =If(locLmConfirmed, ColorValue("#008531"), If(locConfirmMissed, ColorValue("#C42B2B"), ColorValue("#9AA7B2")))
                                          BorderThickness: =2
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Size: =15
                                          FontWeight: =FontWeight.Bold
                                          Width: =28
                                          Height: =28
                                    - aliConfirmText:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          AutoHeight: =true
                                          Text: |-
                                            ="I confirm I have had a conversation with my line manager before accepting/not accepting the role. "
                                            & "(You will not be able to accept/reject your role before doing this)."
                                          OnSelect: |-
                                            =UpdateContext({locLmConfirmed: Not locLmConfirmed, locConfirmMissed: false})
                                          Color: =ColorValue("#1F2933")
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          Width: =Parent.Width - 28 - 12 - 28
                              - conAliBtns:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =66
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =14
                                    PaddingTop: =12
                                    Width: =Parent.Width - 48
                                  Children:
                                    - btnAcceptRole:
                                        Control: Label@2.5.1
                                        Properties:
                                          HoverFill: =ColorValue("#00712A")
                                          PressedFill: =ColorValue("#005A21")
                                          FillPortions: =0
                                          Text: ="Accept role"
                                          # The guard lives in OnSelect, NOT in
                                          # DisplayMode. A disabled Label swallows
                                          # the click silently, so if
                                          # varAlignPublished is ever blank - OnStart
                                          # not re-run, no Alignments row, the person
                                          # missing from People - the button just
                                          # dies with no clue why. This way a click
                                          # always does something. The Patch is still
                                          # protected: there is no row to write to
                                          # when nothing is published.
                                          OnSelect: |-
                                            =If(
                                                Not locLmConfirmed,
                                                UpdateContext({locConfirmMissed: true});
                                                Notify("Please confirm you have had a conversation with your line manager before you accept or reject this role.", NotificationType.Error),
                                                Not varAlignPublished,
                                                Notify("Your aligned role has not loaded, so this cannot be submitted yet. Close and reopen the app, and contact Aurora if it still does not appear.", NotificationType.Error),
                                                UpdateContext({locShowAccept: true})
                                            )
                                          Fill: =ColorValue("#008531")
                                          Color: =ColorValue("#FFFFFF")
                                          BorderThickness: =0
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                          Height: =50
                                          Width: =200
                                    - btnRejectRole:
                                        Control: Label@2.5.1
                                        Properties:
                                          HoverFill: =ColorValue("#FBEAEA")
                                          PressedFill: =ColorValue("#F4D3D3")
                                          FillPortions: =0
                                          Text: ="Reject role"
                                          # Same reasoning as btnAcceptRole above.
                                          OnSelect: |-
                                            =If(
                                                Not locLmConfirmed,
                                                UpdateContext({locConfirmMissed: true});
                                                Notify("Please confirm you have had a conversation with your line manager before you accept or reject this role.", NotificationType.Error),
                                                Not varAlignPublished,
                                                Notify("Your aligned role has not loaded, so there is nothing to reject yet. Close and reopen the app, and contact Aurora if it still does not appear.", NotificationType.Error),
                                                Navigate(scrRejection)
                                            )
                                          Fill: =ColorValue("#FFFFFF")
                                          Color: =ColorValue("#C42B2B")
                                          BorderColor: =ColorValue("#C42B2B")
                                          BorderThickness: =2
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                          Height: =50
                                          Width: =200
                        - lblAliHelp:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =0
                              AutoHeight: =true
                              Text: ="Not sure, or something looks wrong? Contact Aurora before you respond — aurora@environment-agency.gov.uk"
                              OnSelect: =Launch("mailto:aurora@environment-agency.gov.uk")
                              Color: =ColorValue("#5B6670")
                              Size: =13
                              Width: =Parent.Width

      # ======================================================================
      # ACCEPT-CONFIRMATION OVERLAY (scrim + dialog). Visible = locShowAccept.
      # Nothing is written until "Yes, accept role" is pressed; that button
      # stamps the decision and sends the person to the locked outcome page.
      # ======================================================================
      - conAcceptOverlay:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Visible: =locShowAccept
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - recAccScrim:
                Control: Label@2.5.1
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =Parent.Height
                  Fill: =RGBA(0, 43, 84, 0.55)
                  OnSelect: |-
                    =UpdateContext({locShowAccept: false})
            - dlgAccept:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =lblAccTitle.Height + lblAccBody.Height + lblAccRole.Height + 140
                  X: =(Parent.Width - Min(Parent.Width - 48, 520)) / 2
                  Y: =Max((Parent.Height - (lblAccTitle.Height + lblAccBody.Height + lblAccRole.Height + 140)) / 2, 24)
                  Width: =Min(Parent.Width - 48, 520)
                  Fill: =ColorValue("#FFFFFF")
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  PaddingTop: =28
                  PaddingBottom: =22
                  PaddingLeft: =28
                  PaddingRight: =28
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                Children:
                  - lblAccTitle:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width - 56
                        FillPortions: =0
                        Text: ="Accept this role?"
                        Color: =ColorValue("#002B54")
                        Size: =21
                        FontWeight: =FontWeight.Bold
                        AutoHeight: =true
                  - lblAccBody:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =0
                        AutoHeight: =true
                        Text: |-
                          ="This confirms you accept the role you have been aligned to. Your response is recorded straight away and cannot be changed afterwards."
                        Color: =ColorValue("#3A4651")
                        Size: =15
                        Width: =Parent.Width - 56
                  - lblAccRole:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =0
                        AutoHeight: =true
                        Text: =varAlignRole
                        Color: =ColorValue("#002B54")
                        Fill: =ColorValue("#F4F7F9")
                        BorderColor: =ColorValue("#E1E7EC")
                        BorderThickness: =1
                        Size: =15
                        FontWeight: =FontWeight.Bold
                        PaddingTop: =10
                        PaddingBottom: =10
                        PaddingLeft: =13
                        PaddingRight: =13
                        Width: =Parent.Width - 56
                  - conAccBtns:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =60
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutGap: =12
                        PaddingTop: =14
                        Width: =Parent.Width - 56
                      Children:
                        - btnCancelAccept:
                            Control: Label@2.5.1
                            Properties:
                              HoverFill: =ColorValue("#EBF0F5")
                              PressedFill: =ColorValue("#D8E2EB")
                              FillPortions: =0
                              Text: ="Cancel"
                              OnSelect: |-
                                =UpdateContext({locShowAccept: false})
                              Fill: =ColorValue("#FFFFFF")
                              Color: =ColorValue("#002B54")
                              BorderColor: =ColorValue("#002B54")
                              BorderThickness: =2
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Size: =15
                              FontWeight: =FontWeight.Semibold
                              Height: =46
                              Width: =130
                        - btnConfirmAccept:
                            Control: Label@2.5.1
                            Properties:
                              HoverFill: =ColorValue("#00712A")
                              PressedFill: =ColorValue("#005A21")
                              FillPortions: =0
                              Text: ="Yes, accept role"
                              # ===== LOCKS THE ALIGNMENT, THEN EMAILS =====
                              # Also in paste/Phase2-alignment-formulas.powerfx
                              # if it ever needs re-pasting into the formula bar.
                              # Nothing is locked or emailed unless the Patch
                              # succeeds. The email goes to the person with
                              # Aurora and their line manager (People.
                              # LineManagerEmail, read here rather than in
                              # OnStart) on copy; needs the Office 365 Outlook
                              # connector. A failed send warns but never undoes
                              # the saved decision.
                              OnSelect: |-
                                =If(
                                    IsError(
                                        Patch(
                                            'RolePreference Alignments',
                                            LookUp('RolePreference Alignments', EmployeeID = varUser.EmpId),
                                            {Decision: "Accepted", RejectReasons: "", RejectComments: "", AlignmentStatus: "Submitted", DecisionOn: Now(), DecisionBy: User().Email}
                                        )
                                    ),
                                    Notify("Your response could not be saved, so nothing has been sent. Please try again, and contact aurora@environment-agency.gov.uk if it keeps happening.", NotificationType.Error),
                                    Set(varAlignDecision, "Accepted");
                                    Set(varAlignReasonsText, "");
                                    Set(varAlignComments, "");
                                    Set(varAlignStatus, "Submitted");
                                    Set(varAlignSubmitted, true);
                                    Set(varAlignDate, Text(Now(), "dd/mm/yyyy"));
                                    Set(varEmailCc, "aurora@environment-agency.gov.uk" & With({lm: LookUp('RolePreference People', Email = varUserEmail).LineManagerEmail}, If(IsBlank(lm), "", ";" & lm)));
                                    IfError(
                                        Office365Outlook.SendEmailV2(
                                            varUserEmail,
                                            "Aurora role alignment — " & varUser.Name & " has accepted their aligned role",
                                            Substitute(varEmailAccepted, "{{DATE}}", varAlignDate),
                                            {Cc: varEmailCc, Importance: "Normal"}
                                        ),
                                        Notify("Your response has been saved, but the confirmation email could not be sent. Please let aurora@environment-agency.gov.uk know.", NotificationType.Warning)
                                    );
                                    UpdateContext({locShowAccept: false});
                                    Navigate(scrAlignLocked)
                                )
                              Fill: =ColorValue("#008531")
                              Color: =ColorValue("#FFFFFF")
                              BorderThickness: =0
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =46
                              Width: =190
