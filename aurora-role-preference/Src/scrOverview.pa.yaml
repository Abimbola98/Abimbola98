# =============================================================================
# scrOverview — ADMIN ONLY (reached only when varIsAdmin; see README: in-app
# gating is NOT security — enforce Dataverse row-level security too).
#   galRows Items = colOverviewRows  (REPOINT -> Preferences ⋈ People ⋈
#   Eligibility ⋈ PreferenceResponses).
#   Per row: ID, Name, Grade, Area, ranked roles, date, Stage-2 pill, Status
#   pill, "View answers" toggle (varSelectedOverviewId) and "Delete".
#   Delete REMOVES the person's Preferences + PreferenceResponses rows so they
#   can complete the form again; the all-staff row resets to "Not started".
# Deviation: the expand panel is rendered beneath the table for the selected
#   row (rather than literally inside the row) — classic galleries can't do
#   per-row variable height. See README.
# =============================================================================
Screens:
  scrOverview:
    Properties:
      Fill: =ColorValue("#F2F5F7")
      # OnVisible refreshes the tables and rebuilds colOverviewRows/colAllStaff
      # so the admin view is current on every visit (no manual refresh).
      # Screen properties do not paste - see paste/scrOverview_OnVisible.powerfx
      # for the full formula to put in the formula bar.
    Children:
      - conRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =ColorValue("#F2F5F7")
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
          Children:
            - conHeaderBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Fill: =ColorValue("#002B54")
                  Height: =64
                  Width: =Parent.Width
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - lblHdrName:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        Text: ="Aurora — Role Preference"
                        Color: =ColorValue("#FFFFFF")
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                  - lblHdrUser:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        Text: =varUser.Name & "  ·  " & varUser.Grade
                        Color: =ColorValue("#A9BACB")
                        Size: =12
                        Align: =Align.Right
            - recGreenStrip:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Fill: =ColorValue("#008531")
                  Height: =4
                  Width: =Parent.Width
            - conMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  Width: =Parent.Width
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - conContent:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        FillPortions: =1
                        Width: =Min(Parent.Width - 48, 1160)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =18
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                      Children:
                        - conTitleRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =144
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =10
                              Width: =Parent.Width
                            Children:
                              - conTitleText:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =100
                                    FillPortions: =0
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    Width: =Parent.Width - 160
                                  Children:
                                    - btnBackHome:
                                        Control: Label@2.5.1
                                        Properties:
                                          HoverFill: =ColorValue("#E1F2FB")
                                          PressedFill: =ColorValue("#C7E6F4")
                                          FillPortions: =0
                                          Text: ="← Back to home"
                                          OnSelect: =Navigate(scrLanding)
                                          Fill: =ColorValue("#F2F5F7")
                                          Color: =ColorValue("#0E6FA8")
                                          BorderThickness: =0
                                          Align: =Align.Left
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          Width: =160
                                    - lblTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Width: =Parent.Width
                                          FillPortions: =0
                                          Text: ="Submissions overview"
                                          Color: =ColorValue("#002B54")
                                          Size: =24
                                          FontWeight: =FontWeight.Bold
                                          Height: =36
                                    - lblSub:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: =CountRows(colOverviewRows) & " submissions across affected areas. Select a row to view supporting answers."
                                          Color: =ColorValue("#5B6670")
                                          Size: =15
                                          AutoHeight: =true
                                          Width: =Parent.Width
                              - conAdminRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =30
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                    Width: =Parent.Width
                                  Children:
                                    - lblAdminView:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="ADMIN VIEW"
                                          Color: =ColorValue("#002B54")
                                          Fill: =ColorValue("#E1F2FB")
                                          BorderColor: =ColorValue("#BBE2F4")
                                          BorderThickness: =1
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =120
                                          Height: =30
                                    - lblAdminSpacer:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =1
                                          Text: =""
                                          BorderThickness: =0
                                          Height: =28
                                    - btnRefreshOverview:
                                        Control: Label@2.5.1
                                        Properties:
                                          HoverFill: =ColorValue("#E1F2FB")
                                          PressedFill: =ColorValue("#C7E6F4")
                                          FillPortions: =0
                                          Text: ="↻ Refresh data"
                                          OnSelect: |-
                                            =Notify("Refresh is not wired up yet - paste the screen's OnVisible formula into this button's OnSelect.", NotificationType.Warning)
                                          Fill: =ColorValue("#FFFFFF")
                                          Color: =ColorValue("#0E6FA8")
                                          BorderColor: =ColorValue("#BBE2F4")
                                          BorderThickness: =1
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Height: =28
                                          Width: =140
                                    - lblRefreshedOverview:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: =If(IsBlank(varAdminRefreshedAt), "", "Updated " & varAdminRefreshedAt)
                                          Color: =ColorValue("#5B6670")
                                          Size: =12
                                          VerticalAlign: =VerticalAlign.Middle
                                          Height: =28
                                          Width: =130
                        # ---- ALL STAFF completion tracker (UAT request) ------
                        - cardAllStaff:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              # The only table on this screen now. Its chrome is fixed
                              # (64 header + 46 tabs + 44 column head = 154) so the tabs
                              # and counters can never be squeezed out; the row area takes
                              # whatever height the window leaves, with a floor of 5 rows,
                              # and galAllStaff scrolls inside it.
                              FillPortions: =1
                              LayoutMinHeight: =154 + 5 * 44
                              Fill: =ColorValue("#FFFFFF")
                              BorderColor: =ColorValue("#DCE2E8")
                              BorderThickness: =1
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              LayoutDirection: =LayoutDirection.Vertical
                              Width: =Parent.Width
                            Children:
                              - conAllStaffHdr:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =64
                                    FillPortions: =0
                                    Fill: =ColorValue("#EEF2F5")
                                    BorderColor: =ColorValue("#DCE2E8")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =10
                                    PaddingLeft: =22
                                    PaddingRight: =22
                                    Width: =Parent.Width
                                  Children:
                                    - lblAllStaffTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =1
                                          Text: ="All staff — who has completed the form"
                                          Color: =ColorValue("#002B54")
                                          Size: =16
                                          FontWeight: =FontWeight.Bold
                                    - pillDone:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: |-
                                            ="Completed: " & varCountDone
                                          Color: =ColorValue("#006B27")
                                          Fill: =ColorValue("#E4F3EA")
                                          BorderColor: =ColorValue("#B5DEC5")
                                          BorderThickness: =1
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =150
                                          Height: =28
                                    - pillOutstanding:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: |-
                                            ="Outstanding: " & varCountOutstanding
                                          Color: =ColorValue("#8A4B00")
                                          Fill: =ColorValue("#FDF1E3")
                                          BorderColor: =ColorValue("#F4C68A")
                                          BorderThickness: =1
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =170
                                          Height: =28
                              - conStaffTabs:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =46
                                    Width: =Parent.Width
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    PaddingLeft: =22
                                    PaddingRight: =22
                                  Children:
                                    - tabAll:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =150
                                          Height: =32
                                          Text: |-
                                            ="All (" & varCountAll & ")"
                                          OnSelect: =Set(varStaffTab, "All")
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =If(varStaffTab = "All", ColorValue("#FFFFFF"), ColorValue("#002B54"))
                                          Fill: =If(varStaffTab = "All", ColorValue("#002B54"), ColorValue("#FFFFFF"))
                                          BorderColor: =ColorValue("#002B54")
                                          BorderThickness: =1
                                          HoverFill: =If(varStaffTab = "All", ColorValue("#003C75"), ColorValue("#EBF0F5"))
                                          PressedFill: =ColorValue("#D8E2EB")
                                    - tabCompleted:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =180
                                          Height: =32
                                          Text: |-
                                            ="Completed (" & varCountDone & ")"
                                          OnSelect: =Set(varStaffTab, "Completed")
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =If(varStaffTab = "Completed", ColorValue("#FFFFFF"), ColorValue("#006B27"))
                                          Fill: =If(varStaffTab = "Completed", ColorValue("#006B27"), ColorValue("#FFFFFF"))
                                          BorderColor: =ColorValue("#B5DEC5")
                                          BorderThickness: =1
                                          HoverFill: =If(varStaffTab = "Completed", ColorValue("#00712A"), ColorValue("#E4F3EA"))
                                          PressedFill: =ColorValue("#B5DEC5")
                                    - tabOutstanding:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =190
                                          Height: =32
                                          Text: |-
                                            ="Outstanding (" & varCountOutstanding & ")"
                                          OnSelect: =Set(varStaffTab, "Outstanding")
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Color: =If(varStaffTab = "Outstanding", ColorValue("#FFFFFF"), ColorValue("#8A4B00"))
                                          Fill: =If(varStaffTab = "Outstanding", ColorValue("#8A4B00"), ColorValue("#FFFFFF"))
                                          BorderColor: =ColorValue("#F4C68A")
                                          BorderThickness: =1
                                          HoverFill: =If(varStaffTab = "Outstanding", ColorValue("#6E3B00"), ColorValue("#FDF1E3"))
                                          PressedFill: =ColorValue("#F4C68A")
                                    - lblTabHint:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =1
                                          Text: ="Listed A-Z by name. Use the tabs to see who is still outstanding."
                                          Color: =ColorValue("#5B6670")
                                          Size: =12
                                          VerticalAlign: =VerticalAlign.Middle
                                          Height: =32
                              - conStaffColHdr:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =44
                                    FillPortions: =0
                                    BorderColor: =ColorValue("#DCE2E8")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    PaddingLeft: =22
                                    PaddingRight: =22
                                    Width: =Parent.Width
                                  Children:
                                    - hsName:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =1
                                          Text: ="NAME"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                    - hsId:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="EMPLOYEE ID"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =120
                                    - hsGrade:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="GRADE"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =80
                                    - hsArea:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="AREA"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =120
                                    - hsStatus:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="STATUS"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =150
                                    - hsDate:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="SUBMITTED"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =110
                              - galAllStaff:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    Items: |-
                                      =Sort(
                                          If(
                                              varStaffTab = "Completed", Filter(colAllStaff, Status = "Completed"),
                                              varStaffTab = "Outstanding", Filter(colAllStaff, Status <> "Completed"),
                                              colAllStaff
                                          ),
                                          Name, SortOrder.Ascending
                                      )
                                    Width: =Parent.Width
                                    FillPortions: =1
                                    TemplateSize: =44
                                    TemplateFill: =If(ThisItem.Status = "Completed", ColorValue("#FFFFFF"), ColorValue("#FCFDFE"))
                                  Children:
                                    - conStaffRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          BorderColor: =ColorValue("#EEF1F4")
                                          BorderThickness: =1
                                          PaddingLeft: =22
                                          PaddingRight: =22
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight
                                        Children:
                                          - csName:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =1
                                                Text: =ThisItem.Name
                                                Color: =ColorValue("#1F2933")
                                                Size: =14
                                                FontWeight: =FontWeight.Semibold
                                          - csId:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =ThisItem.EmpId
                                                Color: =ColorValue("#5B6670")
                                                Size: =14
                                                Width: =120
                                          - csGrade:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =ThisItem.Grade
                                                Color: =ColorValue("#3A4651")
                                                Size: =14
                                                Width: =80
                                          - csArea:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =ThisItem.Area
                                                Color: =ColorValue("#3A4651")
                                                Size: =14
                                                Width: =120
                                          - csStatus:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =ThisItem.Status
                                                Color: |-
                                                  =Switch(ThisItem.Status, "Completed", ColorValue("#006B27"), "In progress", ColorValue("#0E6FA8"), ColorValue("#8A4B00"))
                                                Fill: |-
                                                  =Switch(ThisItem.Status, "Completed", ColorValue("#E4F3EA"), "In progress", ColorValue("#E1F2FB"), ColorValue("#FDF1E3"))
                                                Size: =12
                                                FontWeight: =FontWeight.Semibold
                                                Align: =Align.Center
                                                VerticalAlign: =VerticalAlign.Middle
                                                Width: =140
                                                Height: =26
                                          - csDate:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =ThisItem.SubmittedOn
                                                Color: =ColorValue("#5B6670")
                                                Size: =13
                                                Width: =110
                        # ---- Link to the detailed submissions screen --------
                        # The submissions table + answer panel used to sit below
                        # this card; together they needed ~1500px, so at 100%
                        # browser zoom neither fitted. They now live on
                        # scrSubmissions and this screen fits a normal window.
                        - btnOpenSubmissions:
                            Control: Label@2.5.1
                            Properties:
                              HoverFill: =ColorValue("#003C75")
                              PressedFill: =ColorValue("#001A33")
                              FillPortions: =0
                              Text: ="View submissions & supporting answers →"
                              OnSelect: =Navigate(scrSubmissions)
                              Fill: =ColorValue("#002B54")
                              Color: =ColorValue("#FFFFFF")
                              BorderThickness: =0
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Size: =15
                              FontWeight: =FontWeight.Semibold
                              Height: =46
                              Width: =360
