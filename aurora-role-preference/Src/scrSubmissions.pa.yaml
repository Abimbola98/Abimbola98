                                        Properties:
                                          FillPortions: =0
                                          AutoHeight: =true
                                          Visible: =LookUp(colOverviewRows, Id = varSelectedOverviewId).Status = "Role rejected"
                                          Text: |-
                                            =With(
                                                {t: LookUp(colOverviewRows, Id = varSelectedOverviewId).Comments},
                                                If(Len(Trim(t)) > 0, t, "(no further information given)")
                                            )
                                          Color: =ColorValue("#1F2933")
                                          Fill: =ColorValue("#F4F7F9")
                                          BorderColor: =ColorValue("#E4E9ED")
                                          BorderThickness: =1
                                          Size: =14
                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =13
                                          PaddingRight: =13
                                          Width: =Parent.Width - 28
                              - lblExpandCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: ="STAGE 2 SUPPORTING ANSWERS — " & Upper(LookUp(colOverviewRows, Id = varSelectedOverviewId).Name)
                                    Color: =ColorValue("#475160")
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Width: =Parent.Width - 40
                              - subSec1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Visible: =Not IsBlank(LookUp(colOverviewRows, Id = varSelectedOverviewId).R1Name)
                                    Height: =subBlk1a.Height + subBlk1b.Height
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: =Parent.Width - 40
