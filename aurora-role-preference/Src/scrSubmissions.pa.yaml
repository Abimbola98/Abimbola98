                                          FillPortions: =0
                                          Height: =subHd1b.Height + subAns1b.Height + 14
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          PaddingTop: =6
                                          PaddingBottom: =4
                                          Width: =Parent.Width
                                        Children:
                                          - subHd1b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
                                                  ="RANK 1 · Q2 — " & LookUp(colOverviewRows, Id = varSelectedOverviewId).R1Name
                                                Color: =ColorValue("#0E6FA8")
                                                Size: =12
                                                FontWeight: =FontWeight.Bold
                                                Width: =Parent.Width
                                          - subAns1b:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                AutoHeight: =true
                                                Text: |-
