# =============================================================================
# scrSubmissions — the detailed submissions table and each person's supporting
# answers, split out of scrOverview. Together they needed roughly 1500px, so at
# 100% browser zoom an admin could not see the whole overview screen; scrOverview
# now keeps the all-staff table and links here.
#   Same access rule as scrOverview: admins see everyone, a line manager sees
#   their reportees only (People.LineManagerEmail), anyone else is sent back by
#   OnVisible. Delete is admin-only.
#   galRows Items = colOverviewRows, built by btnRefreshSubs.OnSelect - the SAME
#   text as btnRefreshOverview on scrOverview. OnVisible runs it via Select().
#   Stage 3: the ALIGNED ROLE and RESPONSE columns replace SUBMITTED / STAGE 2,
#   and View answers opens with the aligned role, the response and - for a
#   rejection - the reasons and further information.
#   Delete is guarded by conDeleteOverlay.
# =============================================================================
Screens:
  scrSubmissions:
    Properties:
      Fill: =ColorValue("#F2F5F7")
    Children:
      - conRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =ColorValue("#F2F5F7")
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
          Children:
            - conHeaderBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Fill: =ColorValue("#002B54")
                  Height: =64
                  Width: =Parent.Width
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - lblHdrName:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        Text: ="Aurora — Role Preference"
                        Color: =ColorValue("#FFFFFF")
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                  - lblHdrUser:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        Text: =varUser.Name & "  ·  " & varUser.Grade
                        Color: =ColorValue("#A9BACB")
                        Size: =12
                        Align: =Align.Right
            - recGreenStrip:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Fill: =ColorValue("#008531")
                  Height: =4
                  Width: =Parent.Width
            - conMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  Width: =Parent.Width
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Center
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - conContent:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        FillPortions: =1
                        Width: =Min(Parent.Width - 48, 1160)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                      Children:
                        - conTopNav:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =30
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =20
                              Width: =Parent.Width
                            Children:
                              - btnBackHome:
                                  Control: Label@2.5.1
                                  Properties:
                                    HoverFill: =ColorValue("#E1F2FB")
                                    PressedFill: =ColorValue("#C7E6F4")
                                    FillPortions: =0
                                    Text: ="← Back to home"
                                    OnSelect: =Navigate(scrLanding)
                                    Fill: =ColorValue("#F2F5F7")
                                    Color: =ColorValue("#0E6FA8")
                                    BorderThickness: =0
                                    Align: =Align.Left
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Width: =160
                              - btnBackOverview:
                                  Control: Label@2.5.1
                                  Properties:
                                    HoverFill: =ColorValue("#E1F2FB")
                                    PressedFill: =ColorValue("#C7E6F4")
                                    FillPortions: =0
                                    Text: ="← Back to all staff"
                                    OnSelect: =Navigate(scrOverview)
                                    Fill: =ColorValue("#F2F5F7")
                                    Color: =ColorValue("#0E6FA8")
                                    BorderThickness: =0
                                    Align: =Align.Left
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Width: =200
                              - lblNavSpacer:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =1
                                    Text: =""
                                    BorderThickness: =0
                                    Height: =28
                              - btnRefreshSubs:
                                  Control: Label@2.5.1
                                  Properties:
                                    HoverFill: =ColorValue("#E1F2FB")
                                    PressedFill: =ColorValue("#C7E6F4")
                                    FillPortions: =0
                                    Text: ="↻ Refresh data"
                                    # The whole admin data build - identical to
                                    # btnRefreshOverview.OnSelect on scrOverview.
                                    OnSelect: |-
                                      =Refresh('RolePreference People');
                                      Refresh('RolePreference Preferences');
                                      Refresh('RolePreference PreferenceResponses');
                                      Refresh('RolePreference Roles');
                                      Refresh('RolePreference Alignments');
                                      ClearCollect(colAllRoles, ForAll('RolePreference Roles' As r, {Key: r.RoleKey, Name: r.RoleName}));
                                      ClearCollect(
                                          colAllStaff,
                                          ForAll(
                                              If(varIsAdmin, 'RolePreference People', Filter('RolePreference People', LineManagerEmail = varUserEmail)) As p,
                                              With(
                                                  {a: LookUp('RolePreference Alignments', EmployeeID = p.EmployeeID)},
                                                  With(
                                                      {s1: LookUp('RolePreference Preferences', EmployeeID = p.EmployeeID And Stage1Status <> "Withdrawn")},
                                                      With(
                                                          {s2: CountRows(Filter('RolePreference PreferenceResponses', EmployeeID = p.EmployeeID And Stage2Status = "Submitted")) > 0},
                                                          With(
                                                              {done: a.AlignmentStatus = "Submitted", rej: a.AlignmentStatus = "Submitted" And a.Decision = "Rejected"},
                                                              {EmpId: p.EmployeeID, Name: p.Name, Grade: p.Grade, Area: p.Area
                                                                  , Stage12: If(s2, "Completed", Not IsBlank(s1), "In progress", "Not started")
                                                                  , SubmittedOn: If(IsBlank(s1), "", Text(s1.SubmittedOn, "dd/mm/yyyy"))
                                                                  , AlignedRole: Coalesce(a.AssignedRoleName, LookUp(colAllRoles, Key = a.AssignedRoleKey).Name, "")
                                                                  , Status: If(rej, "Role rejected", done And a.Decision = "Accepted", "Role accepted"
                                                                      , IsBlank(Coalesce(a.AssignedRoleName, a.AssignedRoleKey)), "No role yet", "Awaiting response")
                                                                  , Reasons: If(rej, a.RejectReasons, ""), Comments: If(rej, a.RejectComments, "")
                                                                  , DecidedOn: If(done, Text(a.DecisionOn, "dd/mm/yyyy"), ""), DecidedSort: If(done, Text(a.DecisionOn, "yyyy-mm-dd hh:mm"), "")}
                                                          )
                                                      )
                                                  )
                                              )
                                          )
                                      );
                                      Set(varCountAll, CountRows(colAllStaff));
                                      Set(varCountAccepted, CountRows(Filter(colAllStaff, Status = "Role accepted")));
                                      Set(varCountRejected, CountRows(Filter(colAllStaff, Status = "Role rejected")));
                                      Set(varCountAwaiting, varCountAll - varCountAccepted - varCountRejected);
                                      ClearCollect(
                                          colOverviewRows,
                                          ForAll(
                                              Filter(colAllStaff, Stage12 <> "Not started") As d,
                                              With(
                                                  {k1: LookUp('RolePreference Preferences', EmployeeID = d.EmpId And Rank = 1).RoleKey},
                                                  With(
                                                      {k2: LookUp('RolePreference Preferences', EmployeeID = d.EmpId And Rank = 2).RoleKey},
                                                      With(
                                                          {k3: LookUp('RolePreference Preferences', EmployeeID = d.EmpId And Rank = 3).RoleKey},
                                                          With(
                                                              {dt: LookUp('RolePreference Preferences', EmployeeID = d.EmpId).SubmittedOn},
                                                              {Id: d.EmpId, EmpId: d.EmpId, Name: d.Name, Grade: d.Grade, Area: d.Area, Stage12: d.Stage12
                                                                  , Date: Text(dt, "dd/mm/yyyy"), SortDateText: Text(dt, "yyyy-mm-dd hh:mm")
                                                                  , AlignedRole: d.AlignedRole, Status: d.Status, Reasons: d.Reasons, Comments: d.Comments
                                                                  , DecidedOn: d.DecidedOn, DecidedSort: d.DecidedSort
                                                                  , R1Name: If(IsBlank(k1), Blank(), Coalesce(LookUp(colAllRoles, Key = k1).Name, "[missing role: " & k1 & "]"))
                                                                  , R1a: LookUp('RolePreference PreferenceResponses', EmployeeID = d.EmpId And RoleKey = k1 And QIndex = 0).ResponseText
                                                                  , R1b: LookUp('RolePreference PreferenceResponses', EmployeeID = d.EmpId And RoleKey = k1 And QIndex = 1).ResponseText
                                                                  , R2Name: If(IsBlank(k2), Blank(), Coalesce(LookUp(colAllRoles, Key = k2).Name, "[missing role: " & k2 & "]"))
                                                                  , R2a: LookUp('RolePreference PreferenceResponses', EmployeeID = d.EmpId And RoleKey = k2 And QIndex = 0).ResponseText
                                                                  , R2b: LookUp('RolePreference PreferenceResponses', EmployeeID = d.EmpId And RoleKey = k2 And QIndex = 1).ResponseText
                                                                  , R3Name: If(IsBlank(k3), Blank(), Coalesce(LookUp(colAllRoles, Key = k3).Name, "[missing role: " & k3 & "]"))
                                                                  , R3a: LookUp('RolePreference PreferenceResponses', EmployeeID = d.EmpId And RoleKey = k3 And QIndex = 0).ResponseText
                                                                  , R3b: LookUp('RolePreference PreferenceResponses', EmployeeID = d.EmpId And RoleKey = k3 And QIndex = 1).ResponseText}
                                                          )
                                                      )
                                                  )
                                              )
                                          )
                                      );
                                      ClearCollect(colAreaOptions, {Value: "All areas"});
                                      Collect(colAreaOptions, ForAll(Sort(Distinct(Filter(colAllStaff, Not IsBlank(Area)), Area), Value, SortOrder.Ascending) As ar, {Value: ar.Value}));
                                      Set(varAdminRefreshedAt, Text(Now(), "HH:mm:ss"))
                                    Fill: =ColorValue("#FFFFFF")
                                    Color: =ColorValue("#0E6FA8")
                                    BorderColor: =ColorValue("#BBE2F4")
                                    BorderThickness: =1
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    Width: =140
                              - lblRefreshedSubs:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: =If(IsBlank(varAdminRefreshedAt), "", "Updated " & varAdminRefreshedAt)
                                    Color: =ColorValue("#5B6670")
                                    Size: =12
                                    VerticalAlign: =VerticalAlign.Middle
                                    Height: =28
                                    Width: =170
                        - lblTitle:
                            Control: Label@2.5.1
                            Properties:
                              Width: =Parent.Width
                              FillPortions: =0
                              Text: ="Submissions & supporting answers"
                              Color: =ColorValue("#002B54")
                              Size: =22
                              FontWeight: =FontWeight.Bold
                              Height: =32
                        # ---- Table card (horizontal scroll on narrow screens) ----
                        - cardTable:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              # Takes the height the window leaves, with a floor of
                              # four rows; galRows scrolls inside it. Chrome is the
                              # 46px filter row + the 64px column header.
                              FillPortions: =1
                              LayoutMinHeight: =110 + 4 * 96
                              Fill: =ColorValue("#FFFFFF")
                              BorderColor: =ColorValue("#DCE2E8")
                              BorderThickness: =1
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              LayoutDirection: =LayoutDirection.Vertical
                              Width: =Parent.Width
                            Children:
                              # ---- Search / filter / sort -------------------------
                              - conSubFilters:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =46
                                    Fill: =ColorValue("#F7F9FA")
                                    BorderColor: =ColorValue("#DCE2E8")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    Width: =Parent.Width
                                  Children:
                                    - txtSubSearch:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          FillPortions: =0
                                          Default: =""
                                          Mode: =TextMode.SingleLine
                                          HintText: ="Search name, area or role"
                                          MaxLength: =60
                                          Size: =13
                                          Color: =ColorValue("#1F2933")
                                          Fill: =ColorValue("#FFFFFF")
                                          BorderColor: =ColorValue("#9AA7B2")
                                          BorderThickness: =1
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          Height: =32
                                          Width: =230
                                    - btnSubClear:
                                        Control: Label@2.5.1
                                        Properties:
                                          HoverFill: =ColorValue("#EBF0F5")
                                          PressedFill: =ColorValue("#D8E2EB")
                                          FillPortions: =0
                                          Visible: =Not IsBlank(txtSubSearch.Text)
                                          Text: ="✕"
                                          OnSelect: =Reset(txtSubSearch)
                                          Fill: =ColorValue("#FFFFFF")
                                          Color: =ColorValue("#5B6670")
                                          BorderColor: =ColorValue("#9AA7B2")
                                          BorderThickness: =1
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Size: =12
                                          Height: =32
                                          Width: =32
                                    - drpSubResponse:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          FillPortions: =0
                                          Items: =["All responses", "Role accepted", "Role rejected", "Awaiting response", "No role yet"]
                                          Default: ="All responses"
                                          Color: =ColorValue("#1F2933")
                                          Fill: =ColorValue("#FFFFFF")
                                          BorderColor: =ColorValue("#9AA7B2")
                                          BorderThickness: =1
                                          Height: =32
                                          Width: =170
                                    - drpSubArea:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          FillPortions: =0
                                          Items: =colAreaOptions
                                          Default: ="All areas"
                                          Color: =ColorValue("#1F2933")
                                          Fill: =ColorValue("#FFFFFF")
                                          BorderColor: =ColorValue("#9AA7B2")
                                          BorderThickness: =1
                                          Height: =32
                                          Width: =170
                                    - drpSubSort:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          FillPortions: =0
                                          Items: =["Submitted (newest)", "Submitted (oldest)", "Responded (newest)", "Name (A-Z)", "Name (Z-A)", "Area", "Aligned role"]
                                          Default: ="Submitted (newest)"
                                          Color: =ColorValue("#1F2933")
                                          Fill: =ColorValue("#FFFFFF")
                                          BorderColor: =ColorValue("#9AA7B2")
                                          BorderThickness: =1
                                          Height: =32
                                          Width: =180
                                    - lblSubShowing:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =1
                                          Text: |-
                                            ="Showing " & CountRows(galRows.AllItems) & " of " & CountRows(colOverviewRows)
                                          Color: =ColorValue("#5B6670")
                                          Size: =12
                                          Align: =Align.Right
                                          VerticalAlign: =VerticalAlign.Middle
                                          Height: =32
                              # Column header row
                              - conColHdr:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =64
                                    FillPortions: =0
                                    Fill: =ColorValue("#EEF2F5")
                                    BorderColor: =ColorValue("#DCE2E8")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    PaddingTop: =12
                                    PaddingBottom: =12
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    LayoutGap: =0
                                    Width: =Parent.Width
                                  Children:
                                    - hName:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =1
                                          Text: ="NAME"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                    - hGrade:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="GRADE"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =70
                                    - hArea:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="AREA"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =130
                                    - hRoles:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="TOP THREE"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =230
                                    - hAligned:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="ALIGNED ROLE"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =200
                                    - hResponse:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="RESPONSE"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =120
                                    - hActions:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="ACTIONS"
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =140
                                          Align: =Align.Right
                              # Rows
                              - galRows:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    Items: |-
                                      =Sort(
                                          Filter(
                                              colOverviewRows,
                                              IsBlank(txtSubSearch.Text) Or Find(Lower(txtSubSearch.Text), Lower(Name & " " & Area & " " & AlignedRole & " " & R1Name & " " & R2Name & " " & R3Name)) > 0,
                                              drpSubResponse.Selected.Value = "All responses" Or Status = drpSubResponse.Selected.Value,
                                              drpSubArea.Selected.Value = "All areas" Or Area = drpSubArea.Selected.Value
                                          ),
                                          Switch(drpSubSort.Selected.Value, "Name (A-Z)", Name, "Name (Z-A)", Name, "Area", Area, "Aligned role", AlignedRole, "Responded (newest)", DecidedSort, SortDateText),
                                          If(drpSubSort.Selected.Value = "Submitted (newest)" Or drpSubSort.Selected.Value = "Responded (newest)" Or drpSubSort.Selected.Value = "Name (Z-A)", SortOrder.Descending, SortOrder.Ascending)
                                      )
                                    Width: =Parent.Width
                                    FillPortions: =1
                                    TemplateSize: =96
                                    TemplateFill: =ColorValue("#FFFFFF")
                                  Children:
                                    - conRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Start
                                          BorderColor: =ColorValue("#E4E9ED")
                                          BorderThickness: =1
                                          PaddingTop: =14
                                          PaddingBottom: =14
                                          PaddingLeft: =16
                                          PaddingRight: =16
                                          Width: =Parent.TemplateWidth
                                          Height: =Parent.TemplateHeight
                                        Children:
                                          - cName:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =1
                                                Text: =ThisItem.Name
                                                Color: =ColorValue("#1F2933")
                                                Size: =14
                                                FontWeight: =FontWeight.Bold
                                          - cGrade:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =ThisItem.Grade
                                                Color: =ColorValue("#3A4651")
                                                Size: =14
                                                Width: =70
                                          - cArea:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =ThisItem.Area
                                                Color: =ColorValue("#3A4651")
                                                Size: =14
                                                Width: =130
                                          - cRoles:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: |-
                                                  =If(IsBlank(ThisItem.R1Name), "—", "1. " & ThisItem.R1Name)
                                                      & If(IsBlank(ThisItem.R2Name), "", Char(10) & "2. " & ThisItem.R2Name)
                                                      & If(IsBlank(ThisItem.R3Name), "", Char(10) & "3. " & ThisItem.R3Name)
                                                Color: =ColorValue("#3A4651")
                                                Size: =13
                                                Height: =66
                                                Width: =230
                                          - cAligned:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =If(IsBlank(ThisItem.AlignedRole), "—", ThisItem.AlignedRole)
                                                Color: =ColorValue("#1F2933")
                                                Size: =13
                                                FontWeight: =FontWeight.Semibold
                                                Height: =66
                                                Width: =200
                                          - cResponse:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: |-
                                                  =Switch(ThisItem.Status, "Role accepted", "Accepted", "Role rejected", "Rejected", "Awaiting response", "Awaiting", "No role yet")
                                                Color: |-
                                                  =Switch(ThisItem.Status, "Role accepted", ColorValue("#006B27"), "Role rejected", ColorValue("#002B54"), "Awaiting response", ColorValue("#8A4B00"), ColorValue("#5B6670"))
                                                Fill: |-
                                                  =Switch(ThisItem.Status, "Role accepted", ColorValue("#E4F3EA"), "Role rejected", ColorValue("#EEF2F5"), "Awaiting response", ColorValue("#FDF1E3"), ColorValue("#F2F5F7"))
                                                Size: =12
                                                FontWeight: =FontWeight.Semibold
                                                Align: =Align.Center
                                                VerticalAlign: =VerticalAlign.Middle
                                                Width: =110
                                                Height: =28
                                          - lblRespGap:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: =""
                                                Width: =10
                                                Height: =28
                                          - conActions:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutAlignItems: =LayoutAlignItems.End
                                                LayoutGap: =8
                                                Width: =140
                                              Children:
                                                - btnToggle:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      HoverFill: =ColorValue("#E1F2FB")
                                                      PressedFill: =ColorValue("#C7E6F4")
                                                      FillPortions: =0
                                                      Text: =If(varSelectedOverviewId = ThisItem.Id, "Hide answers", "View answers")
                                                      OnSelect: =Set(varSelectedOverviewId, If(varSelectedOverviewId = ThisItem.Id, Blank(), ThisItem.Id))
                                                      Fill: =ColorValue("#FFFFFF")
                                                      Color: =ColorValue("#0E6FA8")
                                                      BorderThickness: =0
                                                      Size: =13
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =22
                                                      Width: =120
                                                - btnDelete:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      HoverFill: =ColorValue("#EEF2F5")
                                                      PressedFill: =ColorValue("#DCE2E8")
                                                      FillPortions: =0
                                                      Text: ="Delete"
                                                      # Admins only. A line manager can read their
                                                      # reportees' submissions but not remove them.
                                                      Visible: =varIsAdmin
                                                      # Opens the confirmation dialog; nothing is removed
                                                      # until btnConfirmDelete is pressed.
                                                      OnSelect: |-
                                                        =UpdateContext({locDelId: ThisItem.EmpId, locDelName: ThisItem.Name, locShowDelete: true})
                                                      Fill: =ColorValue("#FFFFFF")
                                                      Color: =ColorValue("#002B54")
                                                      BorderColor: =ColorValue("#9AA7B2")
                                                      BorderThickness: =1
                                                      Size: =13
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =34
                                                      Width: =110
                        # ---- Selected person's Stage 3 outcome + answers ------
                        # subS3Card (aligned role, response and, for a rejection,
                        # the reasons and further information) sits above the
                        # Stage 2 answers. Its Height is the sum of its children,
                        # with the rejection-only ones multiplied out when hidden.
                        # Six explicit blocks in a fixed order - Rank 1 Q1, Rank 1
                        # Q2, Rank 2 Q1 ... - each reading a flat field on
                        # colOverviewRows (R1a, R1b, R2a ...). The previous version
                        # gathered them with Concat over a nested table and came up
                        # empty, because bare column names did not resolve inside
                        # Concat's implicit row scope in this environment.
                        - panelExpand:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: |-
                                =subS3Card.Height + 8 + lblExpandCap.Height + subSec1.Height + 52
                                    + If(Not IsBlank(LookUp(colOverviewRows, Id = varSelectedOverviewId).R2Name), subSec2.Height, 0)
                                    + If(Not IsBlank(LookUp(colOverviewRows, Id = varSelectedOverviewId).R3Name), subSec3.Height, 0)
                              Visible: =Not IsBlank(varSelectedOverviewId)
                              Fill: =ColorValue("#F4F7F9")
                              BorderColor: =ColorValue("#E1E7EC")
                              BorderThickness: =1
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              PaddingTop: =16
                              PaddingBottom: =16
                              PaddingLeft: =20
                              PaddingRight: =20
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              Width: =Parent.Width
                            Children:
                              - subS3Card:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: |-
                                      =subS3Cap.Height + subS3Role.Height + subS3Status.Height + 28 + 2 * 6
                                          + If(
                                              LookUp(colOverviewRows, Id = varSelectedOverviewId).Status = "Role rejected",
                                              subS3ReasonsHd.Height + subS3Reasons.Height + subS3CommentsHd.Height + subS3Comments.Height + 4 * 6,
                                              0
                                          )
                                    Fill: =ColorValue("#FFFFFF")
                                    BorderColor: =ColorValue("#E4E9ED")
                                    BorderThickness: =1
                                    PaddingTop: =14
                                    PaddingBottom: =14
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    Width: =Parent.Width - 40
                                  Children:
                                    - subS3Cap:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          AutoHeight: =true
                                          Text: ="STAGE 3 · ALIGNED ROLE — " & Upper(LookUp(colOverviewRows, Id = varSelectedOverviewId).Name)
                                          Color: =ColorValue("#475160")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =Parent.Width - 28
                                    - subS3Role:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          AutoHeight: =true
                                          Text: |-
                                            =With(
                                                {r: LookUp(colOverviewRows, Id = varSelectedOverviewId).AlignedRole},
                                                If(IsBlank(r), "No role has been published for this person yet.", r)
                                            )
                                          Color: =ColorValue("#002B54")
                                          Size: =17
                                          FontWeight: =FontWeight.Bold
                                          Width: =Parent.Width - 28
                                    - subS3Status:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          AutoHeight: =true
                                          Text: |-
                                            =With(
                                                {o: LookUp(colOverviewRows, Id = varSelectedOverviewId)},
                                                Switch(
                                                    o.Status,
                                                    "Role accepted", "ROLE ACCEPTED on " & o.DecidedOn,
                                                    "Role rejected", "ROLE REJECTED on " & o.DecidedOn,
                                                    "Awaiting response", "AWAITING RESPONSE - they have not accepted or rejected the role yet.",
                                                    "NO ROLE YET"
                                                )
                                            )
                                          Color: |-
                                            =Switch(LookUp(colOverviewRows, Id = varSelectedOverviewId).Status, "Role accepted", ColorValue("#006B27"), "Role rejected", ColorValue("#002B54"), "Awaiting response", ColorValue("#8A4B00"), ColorValue("#5B6670"))
                                          Size: =13
                                          FontWeight: =FontWeight.Semibold
                                          Width: =Parent.Width - 28
                                    - subS3ReasonsHd:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Visible: =LookUp(colOverviewRows, Id = varSelectedOverviewId).Status = "Role rejected"
                                          Text: ="REASONS FOR REJECTING"
                                          Color: =ColorValue("#0E6FA8")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Height: =22
                                          Width: =Parent.Width - 28
                                    - subS3Reasons:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          AutoHeight: =true
                                          Visible: =LookUp(colOverviewRows, Id = varSelectedOverviewId).Status = "Role rejected"
                                          Text: |-
                                            =With(
                                                {t: LookUp(colOverviewRows, Id = varSelectedOverviewId).Reasons},
                                                If(Len(Trim(t)) > 0, "•  " & Substitute(t, "; ", Char(10) & "•  "), "(no reason recorded)")
