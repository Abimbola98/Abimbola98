    Children:
      - recScrim:
          Control: Label@2.5.1
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 43, 84, 0.55)
            OnSelect: |-
              =UpdateContext({locShowSubmit: false})
      - dlgSubmit:
