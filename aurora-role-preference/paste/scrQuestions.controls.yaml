                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutGap: =12
                  PaddingTop: =14
                  Width: =Parent.Width - 56
                Children:
                  - btnCancelSubmit:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#EBF0F5")
                        PressedFill: =ColorValue("#D8E2EB")
                        FillPortions: =0
                        Text: ="Cancel"
                        OnSelect: |-
                          =UpdateContext({locShowSubmit: false})
                        Fill: =ColorValue("#FFFFFF")
                        Color: =ColorValue("#002B54")
                        BorderColor: =ColorValue("#002B54")
                        BorderThickness: =2
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                        Height: =46
                        Width: =130
                  - btnConfirmSubmit:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#00712A")
                        PressedFill: =ColorValue("#005A21")
                        FillPortions: =0
                        Text: ="Yes, submit"
                        OnSelect: |-
                          =ForAll(
                              colAnswers As a,
                              Patch('RolePreference PreferenceResponses',
                                  LookUp('RolePreference PreferenceResponses', EmployeeID = varUser.EmpId And RoleKey = a.RoleKey And QIndex = a.QIndex),
                                  {ResponseText: a.Answer, Stage2Status: "Submitted", SubmittedOn: Now()}
                              )
                          );
                          UpdateIf('RolePreference Preferences', EmployeeID = varUser.EmpId And Stage1Status = "Draft", {Stage1Status: "Submitted", SubmittedOn: Now()});
                          Set(varStage2Submitted, true);
                          Set(varStage2Date, Text(Now(), "dd/mm/yyyy"));
                          UpdateContext({locShowSubmit: false});
                          Navigate(scrCompleted)
                        Fill: =ColorValue("#008531")
                        Color: =ColorValue("#FFFFFF")
                        BorderThickness: =0
                        Size: =15
                        FontWeight: =FontWeight.Bold
                        Height: =46
                        Width: =150
