- conRoot:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =ColorValue("#F2F5F7")
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Stretch
    Children:
      - conHeaderBar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            FillPortions: =0
            Fill: =ColorValue("#002B54")
            Height: =64
            Width: =Parent.Width
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - lblHdrName:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  Text: ="Aurora — Role Preference"
                  Color: =ColorValue("#FFFFFF")
                  Size: =15
                  FontWeight: =FontWeight.Semibold
            - lblHdrUser:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  Text: =varUser.Name & "  ·  " & varUser.Grade
                  Color: =ColorValue("#A9BACB")
                  Size: =12
                  Align: =Align.Right
      - recGreenStrip:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            FillPortions: =0
            Fill: =ColorValue("#008531")
            Height: =4
            Width: =Parent.Width
      - conMain:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            FillPortions: =1
            Width: =Parent.Width
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            PaddingTop: =24
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - conContent:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  FillPortions: =1
                  Width: =Min(Parent.Width - 48, 1120)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =18
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                Children:
                  - conTopNav:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =22
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =20
                        Width: =Parent.Width
                      Children:
                        - btnBackHome:
                            Control: Label@2.5.1
                            Properties:
                              HoverFill: =ColorValue("#E1F2FB")
                              PressedFill: =ColorValue("#C7E6F4")
                              FillPortions: =0
                              Text: ="← Back to home"
                              OnSelect: =Navigate(scrLanding)
                              Fill: =ColorValue("#F2F5F7")
                              Color: =ColorValue("#0E6FA8")
                              BorderThickness: =0
                              Align: =Align.Left
                              Size: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              Width: =160
                        - btnBackReview:
                            Control: Label@2.5.1
                            Properties:
                              HoverFill: =ColorValue("#E1F2FB")
                              PressedFill: =ColorValue("#C7E6F4")
                              FillPortions: =0
                              Text: ="← Back to your ranking"
                              OnSelect: =Navigate(scrReview)
                              Fill: =ColorValue("#F2F5F7")
                              Color: =ColorValue("#0E6FA8")
                              BorderThickness: =0
                              Align: =Align.Left
                              Size: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              Width: =220
                  - lblStagePill:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =0
                        Text: ="● Stage 2 of 2 · Supporting questions"
                        Color: =ColorValue("#0E6FA8")
                        Fill: =ColorValue("#EBF6FB")
                        BorderColor: =ColorValue("#C7E6F4")
                        BorderThickness: =1
                        Size: =12
                        FontWeight: =FontWeight.Bold
                        PaddingLeft: =12
                        PaddingRight: =12
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =290
                        Height: =28
                  - lblTitle:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width
                        FillPortions: =0
                        Text: ="Tell us about your top three choices"
                        Color: =ColorValue("#002B54")
                        Size: =21
                        FontWeight: =FontWeight.Bold
                        Height: =30
                  - lblSub:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =0
                        Text: ="These questions cover your top three preferences. The questions are the same for each role. All questions are required and each answer is limited to 150 words."
                        Color: =ColorValue("#5B6670")
                        Size: =15
                        AutoHeight: =true
                        Width: =Parent.Width
                  - qsnSec1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Visible: =CountRows(colLockedRanking) >= 1
                        FillPortions: =0
                        Height: =qsnHdr1.Height + qsnBlk1a.Height + qsnBlk1b.Height
                        Fill: =ColorValue("#FFFFFF")
                        BorderColor: =ColorValue("#DCE2E8")
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        LayoutDirection: =LayoutDirection.Vertical
                        Width: =Parent.Width
                      Children:
                        - qsnHdr1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =qsnRole1.Height + 57
                              Fill: =ColorValue("#F4F7F9")
                              BorderColor: =ColorValue("#DCE2E8")
                              BorderThickness: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =3
                              PaddingTop: =18
                              PaddingBottom: =18
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - qsnRank1:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="TOP CHOICE · RANK 1"
                                    Color: =ColorValue("#0E6FA8")
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    Width: =Parent.Width - 48
                              - qsnRole1:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: |-
                                      =Index(colLockedRanking, 1).RoleName
                                    Color: =ColorValue("#002B54")
                                    Size: =18
                                    FontWeight: =FontWeight.Bold
                                    Width: =Parent.Width - 48
                        - qsnBlk1a:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =qsnQ1a.Height + 176 + If(qsnErr1a.Visible, 32, 0)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingTop: =16
                              PaddingBottom: =16
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - qsnQ1a:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: |-
                                      =LookUp(colAnswers, RoleKey = Index(colLockedRanking, 1).RoleKey And QIndex = 0).QuestionText
                                    Color: =ColorValue("#1F2933")
                                    Size: =15
                                    FontWeight: =FontWeight.Semibold
                                    Width: =Parent.Width - 48
                              - qsnTxt1a:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    FillPortions: =0
                                    Default: |-
                                      =LookUp(colAnswers, RoleKey = Index(colLockedRanking, 1).RoleKey And QIndex = 0).Answer
                                    Mode: =TextMode.MultiLine
                                    MaxLength: =2000
                                    HintText: ="Type your answer (150 words maximum)…"
                                    OnChange: |-
                                      =Patch(
                                          colAnswers,
                                          LookUp(colAnswers, RoleKey = Index(colLockedRanking, 1).RoleKey And QIndex = 0),
                                          {Answer: Self.Text, WordCount: With({t: Trim(Substitute(Substitute(Substitute(Self.Text, Char(10), " "), "  ", " "), "  ", " "))}, If(IsBlank(t), 0, Len(t) - Len(Substitute(t, " ", "")) + 1))}
                                      );
                                      Set(varDraftSaved, false)
                                    Color: =ColorValue("#1F2933")
                                    Fill: =ColorValue("#FFFFFF")
                                    BorderColor: |-
                                      =With(
                                          {t: Trim(Substitute(Substitute(Substitute(Self.Text, Char(10), " "), "  ", " "), "  ", " "))},
                                          If(Not IsBlank(t) And Len(t) - Len(Substitute(t, " ", "")) + 1 > 150, ColorValue("#C42B2B"), ColorValue("#9AA7B2"))
                                      )
                                    BorderThickness: |-
                                      =With(
                                          {t: Trim(Substitute(Substitute(Substitute(Self.Text, Char(10), " "), "  ", " "), "  ", " "))},
                                          If(Not IsBlank(t) And Len(t) - Len(Substitute(t, " ", "")) + 1 > 150, 2, 1)
                                      )
                                    Size: =15
                                    Height: =110
                                    Width: =Parent.Width - 48
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                              - qsnWc1a:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: |-
                                      =With(
                                          {t: Trim(Substitute(Substitute(Substitute(qsnTxt1a.Text, Char(10), " "), "  ", " "), "  ", " "))},
                                          If(IsBlank(t), 0, Len(t) - Len(Substitute(t, " ", "")) + 1)
                                      ) & " / 150 words"
                                    Color: |-
                                      =With(
                                          {t: Trim(Substitute(Substitute(Substitute(qsnTxt1a.Text, Char(10), " "), "  ", " "), "  ", " "))},
                                          If(Not IsBlank(t) And Len(t) - Len(Substitute(t, " ", "")) + 1 > 150, ColorValue("#C42B2B"), ColorValue("#5B6670"))
                                      )
                                    Size: =12
                                    Align: =Align.Right
                                    Height: =18
                                    Width: =Parent.Width - 48
                              - qsnErr1a:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Visible: |-
                                      =With(
                                          {c: Trim(Substitute(Substitute(Substitute(qsnTxt1a.Text, Char(10), " "), "  ", " "), "  ", " "))},
                                          Not IsBlank(c) And Len(c) - Len(Substitute(c, " ", "")) + 1 > 150
                                      )
                                    Text: ="Too long — reduce this answer to 150 words or fewer before you can save or submit."
                                    Color: =ColorValue("#FFFFFF")
                                    Fill: =ColorValue("#C42B2B")
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    VerticalAlign: =VerticalAlign.Middle
                                    Height: =24
                                    Width: =Parent.Width - 48
