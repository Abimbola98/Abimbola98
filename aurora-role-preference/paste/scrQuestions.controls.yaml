            LayoutGap: =10
          Children:
            - lblDlgTitle:
                Control: Label@2.5.1
                Properties:
                  Width: =Parent.Width
                  FillPortions: =0
                  Text: ="Submit your form?"
                  Color: =ColorValue("#002B54")
                  Size: =21
                  FontWeight: =FontWeight.Bold
                  Height: =30
            - lblDlgBody:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =0
                  Text: ="This submits the whole form. Your ranking and your answers become final and cannot be changed afterwards."
                  Color: =ColorValue("#3A4651")
                  Size: =15
                  AutoHeight: =true
                  Width: =Parent.Width - 56
            - conDlgBtns:
                Control: GroupContainer@1.5.0
