                                    BorderThickness: =0
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Size: =16
                                    FontWeight: =FontWeight.Bold
                                    Height: =50
                                    Width: =200
                              - btnRejectRole:
                                  Control: Label@2.5.1
                                  Properties:
                                    HoverFill: =ColorValue("#FBEAEA")
                                    PressedFill: =ColorValue("#F4D3D3")
                                    FillPortions: =0
                                    Text: ="Reject role"
                                    OnSelect: |-
                                      =If(
                                          varAlignPublished,
                                          Navigate(scrRejection),
                                          Notify("Your aligned role has not loaded, so there is nothing to reject yet. Close and reopen the app, and contact your HR Business Partner if it still does not appear.", NotificationType.Error)
                                      )
                                    Fill: =ColorValue("#FFFFFF")
                                    Color: =ColorValue("#C42B2B")
                                    BorderColor: =ColorValue("#C42B2B")
                                    BorderThickness: =2
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Size: =16
                                    FontWeight: =FontWeight.Bold
                                    Height: =50
                                    Width: =200
                  - lblAliHelp:
