                                                Size: =16
                                                FontWeight: =FontWeight.Bold
                                                Width: =Parent.Width
                                    - btnViewAns1:
                                        Control: Label@2.5.1
                                        Properties:
                                          HoverFill: =ColorValue("#E1F2FB")
                                          PressedFill: =ColorValue("#C7E6F4")
                                          FillPortions: =0
                                          Text: =If(locOpenPref = 1, "Hide answers", "View answers")
