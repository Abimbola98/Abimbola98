- conRoot:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =ColorValue("#F2F5F7")
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Stretch
    Children:
      - conHeaderBar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            FillPortions: =0
            Fill: =ColorValue("#002B54")
            Height: =64
            Width: =Parent.Width
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - lblHdrName:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  Text: ="Aurora — Role Preference"
                  Color: =ColorValue("#FFFFFF")
                  Size: =15
                  FontWeight: =FontWeight.Semibold
            - lblHdrUser:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  Text: =varUser.Name & "  ·  " & varUser.Grade
                  Color: =ColorValue("#A9BACB")
                  Size: =12
                  Align: =Align.Right
      - recGreenStrip:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            FillPortions: =0
            Fill: =ColorValue("#008531")
            Height: =4
            Width: =Parent.Width
      - conMain:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            FillPortions: =1
            Width: =Parent.Width
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            PaddingTop: =20
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - conContent:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  Width: =Min(Parent.Width - 48, 1120)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                Children:
                  - btnBackHome:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#E1F2FB")
                        PressedFill: =ColorValue("#C7E6F4")
                        FillPortions: =0
                        Text: ="← Back to home"
                        OnSelect: =Navigate(scrLanding)
                        Fill: =ColorValue("#F2F5F7")
                        Color: =ColorValue("#0E6FA8")
                        BorderThickness: =0
                        Align: =Align.Left
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Width: =160
                  - lblAliTitle:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =0
                        Width: =Parent.Width
                        Text: ="Role alignment"
                        Color: =ColorValue("#002B54")
                        Size: =24
                        FontWeight: =FontWeight.Bold
                        Height: =34
                  - lblAliIntro:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =0
                        AutoHeight: =true
                        Width: =Parent.Width
                        Text: |-
                          ="Below are the preferences you submitted, the role you have been aligned to, and the reasoning behind that decision. "
                          & "Read it all before you respond — once you accept or reject the role your answer is final."
                        Color: =ColorValue("#5B6670")
                        Size: =15
                  - cardAliPrefs:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: |-
                          =88 + If(CountRows(colLockedRanking) = 0, lblAliNoPrefs.Height, 0)
                              + If(CountRows(colLockedRanking) >= 1, aliSec1.Height, 0)
                              + If(CountRows(colLockedRanking) >= 2, aliSec2.Height, 0)
                              + If(CountRows(colLockedRanking) >= 3, aliSec3.Height, 0)
                        Fill: =ColorValue("#FFFFFF")
                        BorderColor: =ColorValue("#DCE2E8")
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        LayoutDirection: =LayoutDirection.Vertical
                        Width: =Parent.Width
                      Children:
                        - conAliHdr:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =72
                              FillPortions: =0
                              BorderColor: =ColorValue("#DCE2E8")
                              BorderThickness: =1
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutAlignItems: =LayoutAlignItems.Center
                              PaddingTop: =16
                              PaddingBottom: =16
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - lblAliPrefHdr:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =1
                                    Text: ="Your top three preferences"
                                    Color: =ColorValue("#002B54")
                                    Size: =16
                                    FontWeight: =FontWeight.Bold
                              - lblAliPrefPill:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="Locked"
                                    Color: =ColorValue("#5B6670")
                                    Fill: =ColorValue("#EEF2F5")
                                    BorderColor: =ColorValue("#DCE2E8")
                                    BorderThickness: =1
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =80
                                    Height: =26
                        - lblAliNoPrefs:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =0
                              AutoHeight: =true
                              Visible: =CountRows(colLockedRanking) = 0
                              Text: |-
                                ="We do not have a submitted ranking for you, so there is nothing to show here. "
                                & "Your aligned role is below — contact your HR Business Partner if that looks wrong."
                              Color: =ColorValue("#5B6670")
                              Size: =14
                              PaddingTop: =20
                              PaddingBottom: =20
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                        - aliSec1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Visible: =CountRows(colLockedRanking) >= 1
                              Height: =aliRow1.Height + If(locOpenPref = 1, aliPanel1.Height, 0)
                              LayoutDirection: =LayoutDirection.Vertical
                              Width: =Parent.Width
                            Children:
                              - aliRow1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =Max(aliName1.Height + 48, 76)
                                    BorderColor: =ColorValue("#EEF1F4")
                                    BorderThickness: =1
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =16
                                    PaddingTop: =14
                                    PaddingBottom: =14
                                    PaddingLeft: =24
                                    PaddingRight: =24
                                    Width: =Parent.Width
                                  Children:
                                    - aliNum1:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Text: ="1"
                                          Fill: =ColorValue("#002B54")
                                          Color: =ColorValue("#FFFFFF")
                                          Size: =15
                                          FontWeight: =FontWeight.Bold
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =34
                                          Height: =34
                                    - conAliTxt1:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =1
                                          Height: =aliName1.Height + 22
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                        Children:
                                          - aliCap1:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Text: ="PREFERENCE 1"
                                                Color: =ColorValue("#0E6FA8")
                                                Size: =11
                                                FontWeight: =FontWeight.Bold
                                                Height: =16
                                                Width: =Parent.Width
                                          - aliName1:
