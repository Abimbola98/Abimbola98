                      Properties:
                        FillPortions: =0
                        AutoHeight: =true
                        Text: ="Not sure, or something looks wrong? Contact your HR Business Partner before you respond — dart@environment-agency.gov.uk"
                        OnSelect: =Launch("mailto:dart@environment-agency.gov.uk")
                        Color: =ColorValue("#5B6670")
                        Size: =13
                        Width: =Parent.Width
- conAcceptOverlay:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Visible: =locShowAccept
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - recAccScrim:
          Control: Label@2.5.1
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 43, 84, 0.55)
            OnSelect: |-
              =UpdateContext({locShowAccept: false})
      - dlgAccept:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =320
            X: =(Parent.Width - Min(Parent.Width - 48, 520)) / 2
            Y: =Max((Parent.Height - 320) / 2, 24)
            Width: =Min(Parent.Width - 48, 520)
            Fill: =ColorValue("#FFFFFF")
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            PaddingTop: =28
            PaddingBottom: =22
            PaddingLeft: =28
            PaddingRight: =28
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
          Children:
            - lblAccTitle:
                Control: Label@2.5.1
                Properties:
                  Width: =Parent.Width - 56
                  FillPortions: =0
                  Text: ="Accept this role?"
                  Color: =ColorValue("#002B54")
                  Size: =21
                  FontWeight: =FontWeight.Bold
                  AutoHeight: =true
            - lblAccBody:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =0
                  AutoHeight: =true
                  Text: |-
                    ="This confirms you accept the role you have been aligned to. Your response is recorded straight away and cannot be changed afterwards."
                  Color: =ColorValue("#3A4651")
                  Size: =15
                  Width: =Parent.Width - 56
            - lblAccRole:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =0
                  AutoHeight: =true
                  Text: =varAlignRole
                  Color: =ColorValue("#002B54")
                  Fill: =ColorValue("#F4F7F9")
                  BorderColor: =ColorValue("#E1E7EC")
                  BorderThickness: =1
                  Size: =15
                  FontWeight: =FontWeight.Bold
                  PaddingTop: =10
                  PaddingBottom: =10
                  PaddingLeft: =13
                  PaddingRight: =13
                  Width: =Parent.Width - 56
            - conAccBtns:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =60
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutGap: =12
                  PaddingTop: =14
                  Width: =Parent.Width - 56
                Children:
                  - btnCancelAccept:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#EBF0F5")
                        PressedFill: =ColorValue("#D8E2EB")
                        FillPortions: =0
                        Text: ="Cancel"
                        OnSelect: |-
                          =UpdateContext({locShowAccept: false})
                        Fill: =ColorValue("#FFFFFF")
                        Color: =ColorValue("#002B54")
                        BorderColor: =ColorValue("#002B54")
                        BorderThickness: =2
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                        Height: =46
                        Width: =130
                  - btnConfirmAccept:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#00712A")
                        PressedFill: =ColorValue("#005A21")
                        FillPortions: =0
                        Text: ="Yes, accept role"
                        OnSelect: |-
                          =Patch(
                              'RolePreference Alignments',
                              LookUp('RolePreference Alignments', EmployeeID = varUser.EmpId),
                              {Decision: "Accepted", RejectReasons: "", RejectComments: "", Status: "Submitted", DecisionOn: Now(), DecisionBy: User().Email}
                          );
                          Set(varAlignDecision, "Accepted");
                          Set(varAlignReasonsText, "");
                          Set(varAlignComments, "");
                          Set(varAlignStatus, "Submitted");
                          Set(varAlignSubmitted, true);
                          Set(varAlignDate, Text(Now(), "dd/mm/yyyy"));
                          UpdateContext({locShowAccept: false});
                          Navigate(scrAlignLocked)
                        Fill: =ColorValue("#008531")
                        Color: =ColorValue("#FFFFFF")
                        BorderThickness: =0
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Size: =15
                        FontWeight: =FontWeight.Bold
                        Height: =46
                        Width: =190
