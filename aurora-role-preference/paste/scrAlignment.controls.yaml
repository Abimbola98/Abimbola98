                                    Size: =16
                                    FontWeight: =FontWeight.Bold
                              - lblAliRolePill:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="AWAITING YOUR RESPONSE"
                                    Color: =ColorValue("#8A4B00")
                                    Fill: =ColorValue("#FDF1E3")
                                    Size: =11
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =190
                                    Height: =26
                        - conAliRoleBody:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: |-
                                =lblAliRoleName.Height + lblAliReasonCap.Height + lblAliReason.Height + 76
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingTop: =22
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - lblAliRoleName:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: |-
                                      =Coalesce(varAlignRole, "(no role has been published for you yet)")
                                    Color: =ColorValue("#002B54")
                                    Size: =22
                                    FontWeight: =FontWeight.Bold
                                    Width: =Parent.Width - 48
                              - lblAliReasonCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: ="WHY YOU HAVE BEEN ALIGNED TO THIS ROLE"
                                    Color: =ColorValue("#0E6FA8")
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    PaddingTop: =6
                                    Width: =Parent.Width - 48
                              - lblAliReason:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: |-
                                      =Coalesce(varAlignReason, "The reasoning for this alignment has not been added yet. Please contact your HR Business Partner before responding.")
                                    Color: =ColorValue("#1F2933")
                                    Fill: =ColorValue("#F4F7F9")
                                    BorderColor: =ColorValue("#E1E7EC")
                                    BorderThickness: =1
                                    Size: =15
                                    PaddingTop: =14
                                    PaddingBottom: =14
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    Width: =Parent.Width - 48
                  - cardAliDecide:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =lblAliDecideBody.Height + 166
                        Fill: =ColorValue("#FFFFFF")
                        BorderColor: =ColorValue("#DCE2E8")
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        PaddingTop: =22
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        Width: =Parent.Width
                      Children:
                        - lblAliDecideTitle:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =0
                              Text: ="Do you accept this role?"
                              Color: =ColorValue("#002B54")
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Width: =Parent.Width - 48
                        - lblAliDecideBody:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =0
                              AutoHeight: =true
                              Text: |-
                                ="Accepting confirms you are happy to move into this role. If you reject it we will ask you to tell us why, in your own words, before your response is submitted. "
                                & "Either way your answer is final once submitted, so take the time you need."
                              Color: =ColorValue("#5B6670")
                              Size: =14
                              Width: =Parent.Width - 48
                        - conAliBtns:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =66
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =14
                              PaddingTop: =12
                              Width: =Parent.Width - 48
                            Children:
                              - btnAcceptRole:
                                  Control: Label@2.5.1
                                  Properties:
                                    HoverFill: =ColorValue("#00712A")
                                    PressedFill: =ColorValue("#005A21")
                                    FillPortions: =0
                                    Text: ="Accept role"
                                    OnSelect: |-
                                      =If(
                                          varAlignPublished,
                                          UpdateContext({locShowAccept: true}),
                                          Notify("Your aligned role has not loaded, so this cannot be submitted yet. Close and reopen the app, and contact your HR Business Partner if it still does not appear.", NotificationType.Error)
