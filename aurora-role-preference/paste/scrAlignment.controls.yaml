                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        LayoutDirection: =LayoutDirection.Vertical
                        Width: =Parent.Width
                      Children:
                        - conAliRoleHdr:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =72
                              FillPortions: =0
                              Fill: =ColorValue("#002B54")
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutAlignItems: =LayoutAlignItems.Center
                              PaddingTop: =16
                              PaddingBottom: =16
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - lblAliRoleHdr:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =1
                                    Text: ="Your aligned role"
                                    Color: =ColorValue("#FFFFFF")
                                    Size: =16
                                    FontWeight: =FontWeight.Bold
                              - lblAliRolePill:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="AWAITING YOUR RESPONSE"
                                    Color: =ColorValue("#8A4B00")
                                    Fill: =ColorValue("#FDF1E3")
                                    Size: =11
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =230
                                    Height: =26
                        - conAliRoleBody:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =lblAliRoleName.Height + 54
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingTop: =22
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - lblAliRoleName:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: |-
                                      =Coalesce(varAlignRole, "(no role has been published for you yet)")
                                    Color: =ColorValue("#002B54")
                                    Size: =22
                                    FontWeight: =FontWeight.Bold
                                    Width: =Parent.Width - 48
                  - cardAliDecide:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =lblAliDecideBody.Height + conAliLm.Height + conAliConfirm.Height + 186
                        Fill: =ColorValue("#FFFFFF")
                        BorderColor: =ColorValue("#DCE2E8")
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        PaddingTop: =22
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        Width: =Parent.Width
                      Children:
                        - lblAliDecideTitle:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =0
                              Text: ="Do you accept this role?"
                              Color: =ColorValue("#002B54")
                              Size: =18
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Width: =Parent.Width - 48
                        - lblAliDecideBody:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =0
                              AutoHeight: =true
                              Text: |-
                                ="You can either accept the proposed role and team allocation or raise a query where you believe the outcome does not appropriately reflect your circumstances. "
                                & "Queries will be assessed against two criteria:"
                                & Char(10) & "1.  Failure to follow our processes"
                                & Char(10) & "2.  Discrimination"
                              Color: =ColorValue("#5B6670")
                              Size: =14
                              Width: =Parent.Width - 48
                        - conAliLm:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: |-
                                =lblAliLmCap.Height + lblAliLmHelp.Height + aliLmEmail.Height + aliLmEmail2.Height
                                    + If(aliLmStatus.Visible, aliLmStatus.Height + 8, 0) + 3 * 8 + 28
                              Fill: =If(locLmEmailMissed, ColorValue("#FBEAEA"), ColorValue("#F4F7F9"))
                              BorderColor: =If(locLmEmailMissed, ColorValue("#C42B2B"), ColorValue("#E1E7EC"))
                              BorderThickness: =1
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              PaddingTop: =14
                              PaddingBottom: =14
                              PaddingLeft: =14
                              PaddingRight: =14
                              Width: =Parent.Width - 48
                            Children:
                              - lblAliLmCap:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="YOUR LINE MANAGER'S EMAIL"
                                    Color: =ColorValue("#475160")
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Height: =20
                                    Width: =Parent.Width - 28
                              - lblAliLmHelp:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: |-
                                      ="Type it twice to confirm. Your line manager will be copied into the confirmation email, "
                                      & "and will be able to see your response."
                                    Color: =ColorValue("#5B6670")
                                    Size: =13
                                    Width: =Parent.Width - 28
                              - aliLmEmail:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    FillPortions: =0
                                    Default: =""
                                    Mode: =TextMode.SingleLine
                                    HintText: ="firstname.lastname@environment-agency.gov.uk"
                                    MaxLength: =100
                                    OnChange: |-
                                      =UpdateContext({locLmEmailMissed: false})
                                    Size: =14
                                    Color: =ColorValue("#1F2933")
                                    Fill: =ColorValue("#FFFFFF")
                                    BorderColor: =If(locLmEmailMissed, ColorValue("#C42B2B"), ColorValue("#9AA7B2"))
                                    BorderThickness: =1
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    Height: =38
                                    Width: =Min(Parent.Width - 28, 460)
                              - aliLmEmail2:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    FillPortions: =0
                                    Default: =""
                                    Mode: =TextMode.SingleLine
                                    HintText: ="Type it again to confirm"
                                    MaxLength: =100
                                    OnChange: |-
                                      =UpdateContext({locLmEmailMissed: false})
                                    Size: =14
                                    Color: =ColorValue("#1F2933")
                                    Fill: =ColorValue("#FFFFFF")
                                    BorderColor: =If(locLmEmailMissed, ColorValue("#C42B2B"), ColorValue("#9AA7B2"))
                                    BorderThickness: =1
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    Height: =38
                                    Width: =Min(Parent.Width - 28, 460)
                              - aliLmStatus:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Visible: =Len(Trim(aliLmEmail.Text)) + Len(Trim(aliLmEmail2.Text)) > 0
                                    Text: |-
                                      =With(
                                          {e1: Lower(Trim(aliLmEmail.Text)), e2: Lower(Trim(aliLmEmail2.Text))},
                                          If(
                                              Len(e1) = 0 And Len(e2) = 0, "",
                                              Not IsMatch(e1, Match.Email), "Enter a full email address, for example firstname.lastname@environment-agency.gov.uk.",
                                              Len(e2) = 0, "Now type it again in the second box to confirm.",
                                              e1 <> e2, "The two addresses do not match yet.",
                                              e1 = varUserEmail, "That is your own address. Please enter your line manager's email.",
                                              "✓  Confirmed."
                                          )
                                      )
                                    Color: |-
                                      =With(
                                          {e1: Lower(Trim(aliLmEmail.Text)), e2: Lower(Trim(aliLmEmail2.Text))},
                                          If(IsMatch(e1, Match.Email) And e1 = e2 And e1 <> varUserEmail, ColorValue("#006B27"), locLmEmailMissed, ColorValue("#C42B2B"), ColorValue("#8A4B00"))
                                      )
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Width: =Parent.Width - 28
                        - conAliConfirm:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =Max(aliConfirmText.Height, 28) + 24
                              Fill: =If(locConfirmMissed, ColorValue("#FBEAEA"), ColorValue("#F4F7F9"))
                              BorderColor: =If(locConfirmMissed, ColorValue("#C42B2B"), ColorValue("#E1E7EC"))
                              BorderThickness: =1
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutGap: =12
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =14
                              PaddingRight: =14
                              Width: =Parent.Width - 48
                            Children:
                              - aliConfirmBox:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: =If(locLmConfirmed, "✓", "")
                                    OnSelect: |-
                                      =UpdateContext({locLmConfirmed: Not locLmConfirmed, locConfirmMissed: false})
                                    Fill: =If(locLmConfirmed, ColorValue("#008531"), ColorValue("#FFFFFF"))
                                    HoverFill: =If(locLmConfirmed, ColorValue("#00712A"), ColorValue("#E4F3EA"))
                                    PressedFill: =ColorValue("#B5DEC5")
                                    Color: =ColorValue("#FFFFFF")
                                    BorderColor: =If(locLmConfirmed, ColorValue("#008531"), If(locConfirmMissed, ColorValue("#C42B2B"), ColorValue("#9AA7B2")))
                                    BorderThickness: =2
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Size: =15
                                    FontWeight: =FontWeight.Bold
                                    Width: =28
                                    Height: =28
                              - aliConfirmText:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    AutoHeight: =true
                                    Text: |-
                                      ="I confirm I have had a conversation with my line manager before accepting/not accepting the role. "
                                      & "(You will not be able to accept/reject your role before doing this)."
                                    OnSelect: |-
                                      =UpdateContext({locLmConfirmed: Not locLmConfirmed, locConfirmMissed: false})
                                    Color: =ColorValue("#1F2933")
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Width: =Parent.Width - 28 - 12 - 28
                        - conAliBtns:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =66
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =14
                              PaddingTop: =12
                              Width: =Parent.Width - 48
                            Children:
                              - btnAcceptRole:
                                  Control: Label@2.5.1
                                  Properties:
                                    HoverFill: =ColorValue("#00712A")
                                    PressedFill: =ColorValue("#005A21")
                                    FillPortions: =0
                                    Text: ="Accept role"
                                    OnSelect: |-
                                      =With(
                                          {e1: Lower(Trim(aliLmEmail.Text)), e2: Lower(Trim(aliLmEmail2.Text))},
                                          If(
                                              Not IsMatch(e1, Match.Email),
                                              UpdateContext({locLmEmailMissed: true});
                                              Notify("Please enter your line manager's email address.", NotificationType.Error),
                                              e1 <> e2,
                                              UpdateContext({locLmEmailMissed: true});
                                              Notify("The two line manager email addresses do not match. Please check them.", NotificationType.Error),
                                              e1 = varUserEmail,
                                              UpdateContext({locLmEmailMissed: true});
                                              Notify("Please enter your line manager's email address, not your own.", NotificationType.Error),
                                              Not locLmConfirmed,
                                              UpdateContext({locConfirmMissed: true});
                                              Notify("Please confirm you have had a conversation with your line manager before you accept or reject this role.", NotificationType.Error),
                                              Not varAlignPublished,
                                              Notify("Your aligned role has not loaded, so this cannot be submitted yet. Close and reopen the app, and contact Aurora if it still does not appear.", NotificationType.Error),
                                              Set(varAlignLmEmail, e1);
                                              UpdateContext({locShowAccept: true})
                                          )
                                      )
                                    Fill: =ColorValue("#008531")
                                    Color: =ColorValue("#FFFFFF")
                                    BorderThickness: =0
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Size: =16
                                    FontWeight: =FontWeight.Bold
                                    Height: =50
                                    Width: =200
                              - btnRejectRole:
                                  Control: Label@2.5.1
                                  Properties:
                                    HoverFill: =ColorValue("#FBEAEA")
                                    PressedFill: =ColorValue("#F4D3D3")
                                    FillPortions: =0
                                    Text: ="Reject role"
                                    OnSelect: |-
                                      =With(
                                          {e1: Lower(Trim(aliLmEmail.Text)), e2: Lower(Trim(aliLmEmail2.Text))},
                                          If(
                                              Not IsMatch(e1, Match.Email),
                                              UpdateContext({locLmEmailMissed: true});
                                              Notify("Please enter your line manager's email address.", NotificationType.Error),
                                              e1 <> e2,
                                              UpdateContext({locLmEmailMissed: true});
                                              Notify("The two line manager email addresses do not match. Please check them.", NotificationType.Error),
                                              e1 = varUserEmail,
                                              UpdateContext({locLmEmailMissed: true});
                                              Notify("Please enter your line manager's email address, not your own.", NotificationType.Error),
                                              Not locLmConfirmed,
                                              UpdateContext({locConfirmMissed: true});
                                              Notify("Please confirm you have had a conversation with your line manager before you accept or reject this role.", NotificationType.Error),
                                              Not varAlignPublished,
                                              Notify("Your aligned role has not loaded, so there is nothing to reject yet. Close and reopen the app, and contact Aurora if it still does not appear.", NotificationType.Error),
                                              Set(varAlignLmEmail, e1);
                                              Navigate(scrRejection)
                                          )
                                      )
                                    Fill: =ColorValue("#FFFFFF")
                                    Color: =ColorValue("#C42B2B")
                                    BorderColor: =ColorValue("#C42B2B")
                                    BorderThickness: =2
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Size: =16
                                    FontWeight: =FontWeight.Bold
                                    Height: =50
                                    Width: =200
                  - lblAliHelp:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =0
                        AutoHeight: =true
                        Text: ="Not sure, or something looks wrong? Contact Aurora before you respond — aurora@environment-agency.gov.uk"
                        OnSelect: =Launch("mailto:aurora@environment-agency.gov.uk")
                        Color: =ColorValue("#5B6670")
                        Size: =13
                        Width: =Parent.Width
- conAcceptOverlay:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Visible: =locShowAccept
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - recAccScrim:
          Control: Label@2.5.1
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 43, 84, 0.55)
            OnSelect: |-
              =UpdateContext({locShowAccept: false})
      - dlgAccept:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =lblAccTitle.Height + lblAccBody.Height + lblAccRole.Height + 140
            X: =(Parent.Width - Min(Parent.Width - 48, 520)) / 2
            Y: =Max((Parent.Height - (lblAccTitle.Height + lblAccBody.Height + lblAccRole.Height + 140)) / 2, 24)
            Width: =Min(Parent.Width - 48, 520)
            Fill: =ColorValue("#FFFFFF")
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            PaddingTop: =28
            PaddingBottom: =22
            PaddingLeft: =28
            PaddingRight: =28
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
          Children:
            - lblAccTitle:
                Control: Label@2.5.1
                Properties:
                  Width: =Parent.Width - 56
                  FillPortions: =0
                  Text: ="Accept this role?"
                  Color: =ColorValue("#002B54")
                  Size: =21
                  FontWeight: =FontWeight.Bold
                  AutoHeight: =true
            - lblAccBody:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =0
                  AutoHeight: =true
                  Text: |-
                    ="This confirms you accept the role you have been aligned to. Your response is recorded straight away and cannot be changed afterwards."
                  Color: =ColorValue("#3A4651")
                  Size: =15
                  Width: =Parent.Width - 56
            - lblAccRole:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =0
                  AutoHeight: =true
                  Text: =varAlignRole
                  Color: =ColorValue("#002B54")
                  Fill: =ColorValue("#F4F7F9")
                  BorderColor: =ColorValue("#E1E7EC")
                  BorderThickness: =1
                  Size: =15
                  FontWeight: =FontWeight.Bold
                  PaddingTop: =10
                  PaddingBottom: =10
                  PaddingLeft: =13
                  PaddingRight: =13
                  Width: =Parent.Width - 56
            - conAccBtns:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =60
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutGap: =12
                  PaddingTop: =14
                  Width: =Parent.Width - 56
                Children:
                  - btnCancelAccept:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#EBF0F5")
                        PressedFill: =ColorValue("#D8E2EB")
                        FillPortions: =0
                        Text: ="Cancel"
                        OnSelect: |-
                          =UpdateContext({locShowAccept: false})
                        Fill: =ColorValue("#FFFFFF")
                        Color: =ColorValue("#002B54")
                        BorderColor: =ColorValue("#002B54")
                        BorderThickness: =2
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                        Height: =46
                        Width: =130
                  - btnConfirmAccept:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#00712A")
                        PressedFill: =ColorValue("#005A21")
                        FillPortions: =0
                        Text: ="Yes, accept role"
                        OnSelect: |-
                          =If(
                              IsError(
                                  Patch(
                                      'RolePreference Alignments',
                                      LookUp('RolePreference Alignments', EmployeeID = varUser.EmpId),
                                      {Decision: "Accepted", RejectReasons: "", RejectComments: "", AlignmentStatus: "Submitted", DecisionOn: Now(), DecisionBy: User().Email, LineManagerEmail: varAlignLmEmail}
                                  )
                              ),
                              Notify("Your response could not be saved, so nothing has been sent. Please try again, and contact aurora@environment-agency.gov.uk if it keeps happening.", NotificationType.Error),
                              Set(varAlignDecision, "Accepted");
                              Set(varAlignReasonsText, "");
                              Set(varAlignComments, "");
                              Set(varAlignStatus, "Submitted");
                              Set(varAlignSubmitted, true);
                              Set(varAlignDate, Text(Now(), "dd/mm/yyyy"));
                              Select(btnEmailAccept);
                              UpdateContext({locShowAccept: false});
                              Navigate(scrAlignLocked)
                          )
                        Fill: =ColorValue("#008531")
                        Color: =ColorValue("#FFFFFF")
                        BorderThickness: =0
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Size: =15
                        FontWeight: =FontWeight.Bold
                        Height: =46
                        Width: =190
                  - btnEmailAccept:
                      Control: Label@2.5.1
                      Properties:
                        Visible: =false
                        FillPortions: =0
                        Width: =1
                        Height: =1
                        Text: =""
                        OnSelect: |-
                          =IfError(
                              Office365Outlook.SendEmailV2(
                                  varUserEmail,
                                  "Aurora role alignment — " & varUser.Name & " has accepted their aligned role",
                                  Substitute(varEmailAccepted, "{{DATE}}", varAlignDate),
                                  {Cc: "aurora@environment-agency.gov.uk" & If(IsBlank(varAlignLmEmail), "", ";" & varAlignLmEmail), Importance: "Normal"}
                              ),
                              Notify("Your response has been saved, but the confirmation email could not be sent. Please let aurora@environment-agency.gov.uk know.", NotificationType.Warning)
                          )
