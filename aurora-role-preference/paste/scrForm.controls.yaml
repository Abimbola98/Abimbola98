- conRoot:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      DropShadow: =DropShadow.None
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =ColorValue("#F2F5F7")
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =0
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutOverflowY: =LayoutOverflow.Scroll
    Children:
      - conHeaderBar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            FillPortions: =0
            Fill: =ColorValue("#002B54")
            Height: =64
            Width: =Parent.Width
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - lblHdrName:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  Text: ="Aurora — Role Preference"
                  Color: =ColorValue("#FFFFFF")
                  Size: =15
                  FontWeight: =FontWeight.Semibold
            - lblHdrUser:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  Text: =varUser.Name & "  ·  " & varUser.Grade
                  Color: =ColorValue("#A9BACB")
                  Size: =12
                  Align: =Align.Right
      - recGreenStrip:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            FillPortions: =0
            Fill: =ColorValue("#008531")
            Height: =4
            Width: =Parent.Width
      - conMain:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            FillPortions: =1
            Width: =Parent.Width
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            PaddingTop: =24
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - conContent:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  FillPortions: =1
                  Width: =Min(Parent.Width - 48, 1120)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =18
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                Children:
                  - btnBackHome:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#E1F2FB")
                        PressedFill: =ColorValue("#C7E6F4")
                        FillPortions: =0
                        Text: ="← Back to home"
                        OnSelect: =Navigate(scrLanding)
                        Fill: =ColorValue("#F2F5F7")
                        Color: =ColorValue("#0E6FA8")
                        BorderThickness: =0
                        Align: =Align.Left
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        Width: =160
                  - lblStagePill:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =0
                        Text: ="● Stage 1 of 2 · Rank your roles"
                        Color: =ColorValue("#0E6FA8")
                        Fill: =ColorValue("#EBF6FB")
                        BorderColor: =ColorValue("#C7E6F4")
                        BorderThickness: =1
                        Size: =12
                        FontWeight: =FontWeight.Bold
                        PaddingLeft: =12
                        PaddingRight: =12
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =250
                        Height: =28
                  - lblFormTitle:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width
                        FillPortions: =0
                        Text: ="Rank your role preferences"
                        Color: =ColorValue("#002B54")
                        Size: =21
                        FontWeight: =FontWeight.Bold
                        Height: =30
                  - cardDetails:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =76
                        FillPortions: =0
                        Fill: =ColorValue("#FFFFFF")
                        BorderColor: =ColorValue("#DCE2E8")
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =20
                        PaddingRight: =20
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        Width: =Parent.Width
                      Children:
                        - conUserFields:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =56
                              Width: =Parent.Width - 40
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =14
                            Children:
                              - lblReadOnly:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Width: =92
                                    Text: ="Your details"
                                    Color: =ColorValue("#002B54")
                                    Size: =13
                                    FontWeight: =FontWeight.Bold
                                    VerticalAlign: =VerticalAlign.Bottom
                                    Height: =52
                              - conField1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                  Children:
                                    - lblCap1:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =Parent.Width
                                          Text: ="NAME"
                                          Color: =ColorValue("#5B6670")
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Height: =16
                                    - boxField1:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =Parent.Width
                                          Text: =varUser.Name
                                          Color: =ColorValue("#3A4651")
                                          Fill: =ColorValue("#EEF2F5")
                                          BorderColor: =ColorValue("#D4DCE2")
                                          BorderThickness: =1
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          PaddingLeft: =10
                                          VerticalAlign: =VerticalAlign.Middle
                                          Height: =36
                              - conField2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                  Children:
                                    - lblCap2:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =Parent.Width
                                          Text: ="EMPLOYEE ID"
                                          Color: =ColorValue("#5B6670")
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Height: =16
                                    - boxField2:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =Parent.Width
                                          Text: =varUser.EmpId
                                          Color: =ColorValue("#3A4651")
                                          Fill: =ColorValue("#EEF2F5")
                                          BorderColor: =ColorValue("#D4DCE2")
                                          BorderThickness: =1
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          PaddingLeft: =10
                                          VerticalAlign: =VerticalAlign.Middle
                                          Height: =36
                              - conField3:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                  Children:
                                    - lblCap3:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =Parent.Width
                                          Text: ="GRADE"
                                          Color: =ColorValue("#5B6670")
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Height: =16
                                    - boxField3:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =Parent.Width
                                          Text: =varUser.Grade
                                          Color: =ColorValue("#3A4651")
                                          Fill: =ColorValue("#EEF2F5")
                                          BorderColor: =ColorValue("#D4DCE2")
                                          BorderThickness: =1
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          PaddingLeft: =10
                                          VerticalAlign: =VerticalAlign.Middle
                                          Height: =36
                              - conField4:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                  Children:
                                    - lblCap4:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =Parent.Width
                                          Text: ="AREA"
                                          Color: =ColorValue("#5B6670")
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Height: =16
                                    - boxField4:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          Width: =Parent.Width
                                          Text: =varUser.Area
                                          Color: =ColorValue("#3A4651")
                                          Fill: =ColorValue("#EEF2F5")
                                          BorderColor: =ColorValue("#D4DCE2")
                                          BorderThickness: =1
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          PaddingLeft: =10
                                          VerticalAlign: =VerticalAlign.Middle
                                          Height: =36
                  - calloutInstruction:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =64
                        FillPortions: =0
                        Fill: =ColorValue("#EBF6FB")
                        BorderColor: =ColorValue("#C7E6F4")
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =18
                        PaddingRight: =18
                        Width: =Parent.Width
                      Children:
                        - lblInstruction:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =0
                              Text: ="Rank the roles below that you have been identified as eligible for. Each role must have a unique rank."
                              Color: =ColorValue("#1F2933")
                              Size: =15
                              FontWeight: =FontWeight.Semibold
                              AutoHeight: =true
                              Width: =Parent.Width - 36
                  - panelErrors:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =64
                        FillPortions: =0
                        Visible: =CountRows(colFormErrors) > 0
                        Fill: =ColorValue("#FDF1E3")
                        BorderColor: =ColorValue("#F4C68A")
                        BorderThickness: =1
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        PaddingTop: =8
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        Width: =Parent.Width
                      Children:
                        - lblErrTitle:
                            Control: Label@2.5.1
                            Properties:
                              Width: =Parent.Width
                              FillPortions: =0
                              Text: ="There is a problem"
                              Color: =ColorValue("#8A4B00")
                              Size: =15
                              FontWeight: =FontWeight.Bold
                              Height: =22
                        - galErrors:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              FillPortions: =0
                              Items: =colFormErrors
                              Width: =Parent.Width - 40
                              Height: =CountRows(colFormErrors) * 24 + 4
                              TemplateSize: =24
                            Children:
                              - lblErrItem:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="• " & ThisItem.Msg
                                    Color: =ColorValue("#8A4B00")
                                    Size: =14
                                    Height: =22
                                    Width: =Parent.TemplateWidth
                  - cardRoles:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =66 + CountRows(colRanks) * 88
                        Fill: =ColorValue("#FFFFFF")
                        BorderColor: =ColorValue("#DCE2E8")
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =0
                        Width: =Parent.Width
                      Children:
                        - conRolesHdr:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =66
                              FillPortions: =0
                              Fill: =ColorValue("#EEF2F5")
                              BorderColor: =ColorValue("#DCE2E8")
                              BorderThickness: =1
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              PaddingTop: =13
                              PaddingBottom: =13
                              PaddingLeft: =22
                              PaddingRight: =22
                              Width: =Parent.Width
                            Children:
                              - lblColRole:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =1
                                    Text: ="ELIGIBLE ROLE"
                                    Color: =ColorValue("#475160")
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                              - lblColRank:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="RANK"
                                    Color: =ColorValue("#475160")
                                    Size: =12
                                    FontWeight: =FontWeight.Bold
                                    Width: =96
                        - galRoles:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: =colRanks
                              Width: =Parent.Width
                              FillPortions: =0
                              Height: =CountRows(colRanks) * 88
                              TemplateSize: =88
                              TemplateFill: |-
                                =If(
                                    ThisItem.Rank > 0 And CountRows(Filter(colRanks, Rank = ThisItem.Rank)) > 1,
                                    ColorValue("#FDF1E3"),
                                    ColorValue("#FFFFFF")
                                )
                            Children:
                              - conRoleRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                    LayoutAlignItems: =LayoutAlignItems.Start
                                    PaddingTop: =18
                                    PaddingBottom: =18
                                    PaddingLeft: =22
                                    PaddingRight: =22
                                    LayoutGap: =24
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight
                                  Children:
                                    - conRoleText:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          Width: =Parent.Width - 150
                                        Children:
                                          - lblRoleName:
                                              Control: Label@2.5.1
                                              Properties:
                                                Width: =Parent.Width
                                                FillPortions: =0
                                                Text: =ThisItem.RoleName
                                                Color: =ColorValue("#1F2933")
                                                Size: =16
                                                FontWeight: =FontWeight.Bold
                                                Height: =24
                                          - lblDupMsg:
                                              Control: Label@2.5.1
                                              Properties:
                                                FillPortions: =0
                                                Visible: =ThisItem.Rank > 0 And CountRows(Filter(colRanks, Rank = ThisItem.Rank)) > 1
                                                Text: ="This rank is used by more than one role."
                                                Color: =ColorValue("#8A4B00")
                                                Size: =13
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                Width: =Parent.Width
                                    - drpRank:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          FillPortions: =0
                                          Items: =Sequence(CountRows(colRanks) + 1, 0)
                                          Default: =Text(ThisItem.Rank)
                                          OnChange: |-
                                            =Patch(colRanks, LookUp(colRanks, RoleKey = ThisItem.RoleKey), {Rank: Value(Self.Selected.Value)});
                                            ClearCollect(
                                                colFormErrors,
                                                ForAll(
                                                    Filter(Sequence(CountRows(colRanks)) As r, CountRows(Filter(colRanks, Rank = r.Value)) > 1) As d,
                                                    {Msg: "Rank " & d.Value & " has been selected for more than one role. Each role must have a unique rank."}
                                                )
                                            );
                                            If(
                                                CountRows(Filter(colRanks, Rank = 0 Or IsBlank(Rank))) > 0,
                                                Collect(colFormErrors, {Msg: "Every role must be given a rank before you can submit."})
                                            )
                                          Width: =96
                                          Height: =46
                                          Color: =ColorValue("#1F2933")
                                          Fill: =ColorValue("#FFFFFF")
                                          BorderColor: |-
                                            =If(
                                                ThisItem.Rank > 0 And CountRows(Filter(colRanks, Rank = ThisItem.Rank)) > 1,
                                                ColorValue("#F78913"),
                                                ColorValue("#9AA7B2")
                                            )
                                          BorderThickness: |-
                                            =If(ThisItem.Rank > 0 And CountRows(Filter(colRanks, Rank = ThisItem.Rank)) > 1, 2, 1)
                  - conFooter:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =140
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutAlignItems: =LayoutAlignItems.End
                        LayoutGap: =12
                        Width: =Parent.Width
                      Children:
                        - btnHome:
                            Control: Label@2.5.1
                            Properties:
                              HoverFill: =ColorValue("#EBF0F5")
                              PressedFill: =ColorValue("#D8E2EB")
                              FillPortions: =0
                              Text: ="Home"
                              OnSelect: =Navigate(scrLanding)
                              Fill: =ColorValue("#FFFFFF")
                              Color: =ColorValue("#002B54")
                              BorderColor: =ColorValue("#002B54")
                              BorderThickness: =2
                              Size: =16
                              FontWeight: =FontWeight.Semibold
                              Height: =48
                              Width: =120
                        - conContinueWrap:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =140
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =18
                              Width: =520
                            Children:
                              - lblHelper:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =0
                                    Text: ="Your ranking is saved as a draft and can be changed until you submit the whole form. Next, you'll answer questions about your top three choices."
                                    Color: =ColorValue("#5B6670")
                                    Size: =13
                                    Align: =Align.Right
                                    AutoHeight: =true
                                    Width: =310
                              - btnContinue:
                                  Control: Label@2.5.1
                                  Properties:
                                    HoverFill: =ColorValue("#00712A")
                                    PressedFill: =ColorValue("#005A21")
                                    FillPortions: =0
                                    Text: ="Continue"
                                    DisplayMode: |-
                                      =If(
                                          With({s: Filter(colRanks, Rank > 0)}, CountRows(s) = CountRows(colRanks) And CountRows(Distinct(s, Rank)) = CountRows(colRanks)),
                                          DisplayMode.Edit, DisplayMode.Disabled
                                      )
                                    OnSelect: |-
                                      =UpdateContext({locShowContinue: true})
                                    Fill: |-
                                      =If(
                                          With({s: Filter(colRanks, Rank > 0)}, CountRows(s) = CountRows(colRanks) And CountRows(Distinct(s, Rank)) = CountRows(colRanks)),
                                          ColorValue("#008531"), ColorValue("#C8CFD5")
                                      )
                                    Color: |-
                                      =If(
                                          With({s: Filter(colRanks, Rank > 0)}, CountRows(s) = CountRows(colRanks) And CountRows(Distinct(s, Rank)) = CountRows(colRanks)),
                                          ColorValue("#FFFFFF"), ColorValue("#79838C")
                                      )
                                    BorderThickness: =0
                                    Size: =16
                                    FontWeight: =FontWeight.Bold
                                    Height: =48
                                    Width: =150
                  - lblHelpContact:
                      Control: Label@2.5.1
                      Properties:
                        Width: =Parent.Width
                        FillPortions: =0
                        Text: ="Need help? Contact dart@environment-agency.gov.uk"
                        OnSelect: =Launch("mailto:dart@environment-agency.gov.uk")
                        HoverFill: =ColorValue("#E1F2FB")
                        PressedFill: =ColorValue("#C7E6F4")
                        Color: =ColorValue("#0E6FA8")
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Height: =20
- conContinueOverlay:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Visible: =locShowContinue
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - recScrim:
          Control: Label@2.5.1
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 43, 84, 0.55)
            OnSelect: |-
              =UpdateContext({locShowContinue: false})
      - dlgContinue:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =360
            X: =(Parent.Width - Min(Parent.Width - 48, 480)) / 2
            Y: =Max((Parent.Height - 360) / 2, 24)
            Width: =Min(Parent.Width - 48, 480)
            Fill: =ColorValue("#FFFFFF")
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            PaddingTop: =28
            PaddingBottom: =22
            PaddingLeft: =28
            PaddingRight: =28
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
          Children:
            - lblDlgTitle:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =0
                  Text: ="Save your ranking and continue?"
                  Color: =ColorValue("#002B54")
                  Size: =21
                  FontWeight: =FontWeight.Bold
                  AutoHeight: =true
                  Width: =Parent.Width - 56
            - lblDlgBody:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =0
                  Text: ="Your ranking will be saved as a draft — you can come back and change it at any time before you submit the whole form. You will now answer questions about your top three choices."
                  Color: =ColorValue("#3A4651")
                  Size: =15
                  AutoHeight: =true
                  Width: =Parent.Width - 56
            - conDlgBtns:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =60
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutGap: =12
                  PaddingTop: =14
                  Width: =Parent.Width - 56
                Children:
                  - btnKeepEditing:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#EBF0F5")
                        PressedFill: =ColorValue("#D8E2EB")
                        FillPortions: =0
                        Text: ="Keep editing"
                        OnSelect: |-
                          =UpdateContext({locShowContinue: false})
                        Fill: =ColorValue("#FFFFFF")
                        Color: =ColorValue("#002B54")
                        BorderColor: =ColorValue("#002B54")
                        BorderThickness: =2
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                        Height: =46
                        Width: =150
                  - btnConfirmContinue:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#00712A")
                        PressedFill: =ColorValue("#005A21")
                        FillPortions: =0
                        Text: ="Yes, continue"
                        OnSelect: |-
                          =ClearCollect(colLockedRanking, SortByColumns(colRanks, "Rank", SortOrder.Ascending));
                          ClearCollect(
                              colPreferences,
                              ForAll(
                                  colLockedRanking As r,
                                  {EmployeeID: varUser.EmpId, RoleKey: r.RoleKey, Rank: r.Rank, SubmittedBy: User().Email, SubmittedOn: Now(), Stage1Status: "Submitted"}
                              )
                          );
                          Set(varQ1a, "Please provide a brief explanation as to why you have selected this role as your ");
                          Set(varQ1b, " preference. For example; do you think this role aligns best with the activities you currently undertake? Will this role make the best use of your existing relationships? ");
                          Set(varQ1c, "Do you think this role will align best with a specific area of interest e.g. Carbon? Any information provided will be used to inform the outcome of this process where possible.");
                          Set(varQ2a, "Please use this space to provide any additional information on skills, experience or qualifications relevant to this role that you would like us to be aware of. ");
                          Set(varQ2b, "Any information provided will be used to inform the outcome of this process where possible.");
                          With(
                              {r1: LookUp(colLockedRanking, Rank = 1), r2: LookUp(colLockedRanking, Rank = 2), r3: LookUp(colLockedRanking, Rank = 3)},
                              ClearCollect(
                                  colAnswers,
                                  {RoleKey: r1.RoleKey, RoleName: r1.RoleName, Ordinal: "first", RankLabel: "Top choice · Rank 1", QIndex: 0, Required: true, WordCount: 0, Answer: "", QuestionText: varQ1a & "first" & varQ1b & varQ1c},
                                  {RoleKey: r1.RoleKey, RoleName: r1.RoleName, Ordinal: "first", RankLabel: "Top choice · Rank 1", QIndex: 1, Required: true, WordCount: 0, Answer: "", QuestionText: varQ2a & varQ2b},
                                  {RoleKey: r2.RoleKey, RoleName: r2.RoleName, Ordinal: "second", RankLabel: "Second choice · Rank 2", QIndex: 0, Required: true, WordCount: 0, Answer: "", QuestionText: varQ1a & "second" & varQ1b & varQ1c},
                                  {RoleKey: r2.RoleKey, RoleName: r2.RoleName, Ordinal: "second", RankLabel: "Second choice · Rank 2", QIndex: 1, Required: true, WordCount: 0, Answer: "", QuestionText: varQ2a & varQ2b},
                                  {RoleKey: r3.RoleKey, RoleName: r3.RoleName, Ordinal: "third", RankLabel: "Third choice · Rank 3", QIndex: 0, Required: true, WordCount: 0, Answer: "", QuestionText: varQ1a & "third" & varQ1b & varQ1c},
                                  {RoleKey: r3.RoleKey, RoleName: r3.RoleName, Ordinal: "third", RankLabel: "Third choice · Rank 3", QIndex: 1, Required: true, WordCount: 0, Answer: "", QuestionText: varQ2a & varQ2b}
                              )
                          );
                          RemoveIf(colAnswers, IsBlank(RoleKey));
                          /* Idempotent submit: clear THIS user's prior rows first so a
                             re-submission (e.g. after an admin withdraw) never duplicates. */
                          /* Snapshot any answers already typed so a ranking change doesn't
                             lose them - rows are rebuilt below with the text restored for
                             roles still in the top 3. */
                          ClearCollect(colPrevAns, Filter('RolePreference PreferenceResponses', EmployeeID = varUser.EmpId));
                          RemoveIf('RolePreference Preferences', EmployeeID = varUser.EmpId);
                          RemoveIf('RolePreference PreferenceResponses', EmployeeID = varUser.EmpId);
                          Collect('RolePreference Preferences',
                              ForAll(colLockedRanking As r, {EmployeeID: varUser.EmpId, RoleKey: r.RoleKey, Rank: r.Rank, SubmittedBy: User().Email, SubmittedOn: Now(), Stage1Status: "Draft"})
                          );
                          Collect('RolePreference PreferenceResponses',
                              ForAll(colAnswers As a,
                                  {EmployeeID: varUser.EmpId, RoleKey: a.RoleKey, QIndex: a.QIndex, QuestionText: a.QuestionText, ResponseText: LookUp(colPrevAns, RoleKey = a.RoleKey And QIndex = a.QIndex).ResponseText, Stage2Status: "Draft"}
                              )
                          );
                          Set(varStage1Submitted, true);
                          Set(varStage1Date, Text(Now(), "dd/mm/yyyy"));
                          UpdateContext({locShowContinue: false});
                          Navigate(scrReview)
                        Fill: =ColorValue("#008531")
                        Color: =ColorValue("#FFFFFF")
                        BorderThickness: =0
                        Size: =15
                        FontWeight: =FontWeight.Bold
                        Height: =46
                        Width: =150
