                                          Text: |-
                                            =With(
                                                {a: LookUp(colOverviewRows, Id = varSelectedOverviewId).R2b},
                                                If(Len(Trim(a)) > 0, a, "(not answered yet)")
                                            )
                                          Color: =ColorValue("#1F2933")
                                          Fill: =ColorValue("#FFFFFF")
                                          BorderColor: =ColorValue("#E4E9ED")
                                          BorderThickness: =1
                                          Size: =14
                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =13
                                          PaddingRight: =13
                                          Width: =Parent.Width
                        - subSec3:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Visible: =Not IsBlank(LookUp(colOverviewRows, Id = varSelectedOverviewId).R3Name)
                              Height: =subBlk3a.Height + subBlk3b.Height
                              LayoutDirection: =LayoutDirection.Vertical
                              Width: =Parent.Width - 40
                            Children:
                              - subBlk3a:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =subHd3a.Height + subAns3a.Height + 14
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    PaddingTop: =6
                                    PaddingBottom: =4
                                    Width: =Parent.Width
                                  Children:
                                    - subHd3a:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          AutoHeight: =true
                                          Text: |-
                                            ="RANK 3 · Q1 — " & LookUp(colOverviewRows, Id = varSelectedOverviewId).R3Name
                                          Color: =ColorValue("#0E6FA8")
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Width: =Parent.Width
                                    - subAns3a:
                                        Control: Label@2.5.1
                                        Properties:
                                          FillPortions: =0
                                          AutoHeight: =true
                                          Text: |-
                                            =With(
                                                {a: LookUp(colOverviewRows, Id = varSelectedOverviewId).R3a},
                                                If(Len(Trim(a)) > 0, a, "(not answered yet)")
                                            )
                                          Color: =ColorValue("#1F2933")
