                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =13
                                          PaddingRight: =13
                                          Width: =Parent.Width
                              - subBlk3b:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =subHd3b.Height + subAns3b.Height + 14
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    PaddingTop: =6
                                    PaddingBottom: =4
