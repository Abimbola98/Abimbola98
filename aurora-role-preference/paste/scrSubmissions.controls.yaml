                                          Size: =14
                                          PaddingTop: =10
                                          PaddingBottom: =10
                                          PaddingLeft: =13
                                          PaddingRight: =13
                                          Width: =Parent.Width
- conDeleteOverlay:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      DropShadow: =DropShadow.None
      Visible: =locShowDelete
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - recDelScrim:
          Control: Label@2.5.1
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 43, 84, 0.55)
            OnSelect: |-
              =UpdateContext({locShowDelete: false})
      - dlgDelete:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =300
            X: =(Parent.Width - Min(Parent.Width - 48, 520)) / 2
            Y: =Max((Parent.Height - 300) / 2, 24)
            Width: =Min(Parent.Width - 48, 520)
            Fill: =ColorValue("#FFFFFF")
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            PaddingTop: =28
            PaddingBottom: =22
            PaddingLeft: =28
            PaddingRight: =28
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
          Children:
            - lblDelTitle:
                Control: Label@2.5.1
                Properties:
                  Width: =Parent.Width - 56
                  FillPortions: =0
                  Text: ="Are you sure you want to delete this record?"
                  Color: =ColorValue("#002B54")
                  Size: =20
                  FontWeight: =FontWeight.Bold
                  AutoHeight: =true
            - lblDelBody:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =0
                  Text: |-
                    ="This permanently removes the ranking and all supporting answers for " & locDelName & ". They will be able to complete the form again from the start. This cannot be undone."
                  Color: =ColorValue("#3A4651")
                  Size: =15
                  AutoHeight: =true
                  Width: =Parent.Width - 56
            - conDelBtns:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =60
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutGap: =12
                  PaddingTop: =14
                  Width: =Parent.Width - 56
                Children:
                  - btnCancelDelete:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#EBF0F5")
                        PressedFill: =ColorValue("#D8E2EB")
                        FillPortions: =0
                        Text: ="Cancel"
                        OnSelect: |-
                          =UpdateContext({locShowDelete: false})
                        Fill: =ColorValue("#FFFFFF")
                        Color: =ColorValue("#002B54")
                        BorderColor: =ColorValue("#002B54")
                        BorderThickness: =2
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                        Height: =46
                        Width: =130
                  - btnConfirmDelete:
                      Control: Label@2.5.1
                      Properties:
                        HoverFill: =ColorValue("#A32020")
                        PressedFill: =ColorValue("#7C1818")
                        FillPortions: =0
                        Text: ="Yes, delete"
                        OnSelect: |-
                          =RemoveIf('RolePreference Preferences', EmployeeID = locDelId);
                          RemoveIf('RolePreference PreferenceResponses', EmployeeID = locDelId);
                          RemoveIf(colOverviewRows, EmpId = locDelId);
                          Patch(colAllStaff, LookUp(colAllStaff, EmpId = locDelId), {Status: "Not started", SubmittedOn: "", Ord: 1});
                          Set(varCountDone, CountRows(Filter(colAllStaff, Status = "Completed")));
                          Set(varCountOutstanding, CountRows(Filter(colAllStaff, Status <> "Completed")));
                          Set(varSelectedOverviewId, Blank());
                          UpdateContext({locShowDelete: false});
                          Notify("Record deleted - " & locDelName & " can complete the form again.", NotificationType.Success)
                        Fill: =ColorValue("#C42B2B")
                        Color: =ColorValue("#FFFFFF")
                        BorderThickness: =0
                        Size: =15
                        FontWeight: =FontWeight.Bold
                        Height: =46
                        Width: =150
